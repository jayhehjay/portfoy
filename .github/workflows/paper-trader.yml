name: paper-trader
# Günlük sanal (paper) işlem: yeni kapanmış barları işler, durumu ve raporu repoya yazar.
# NOT: GitHub zamanlanmış çalıştırmalar yalnızca varsayılan dalda (main) çalışır.
on:
  schedule:
    - cron: "17 23 * * *"   # her gün 23:17 UTC (ABD piyasası ve vadeli işlemler kapandıktan sonra)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: paper-trader
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Paper trading adımı
        working-directory: trader
        run: python3 portfolio.py paper --once
      - name: Durumu kaydet
        run: |
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add trader/state trader/REPORT.md trader/journal.log
          git diff --cached --quiet || (git commit -m "paper-trader: günlük güncelleme" && git push)
