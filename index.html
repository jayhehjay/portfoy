  .evt-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .evt-head .et { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .evt-bell { margin-left:auto; border:1px solid var(--border-strong); border-radius:9px; background:var(--panel-2); color:var(--muted); font-size:0.68rem; font-weight:700; padding:5px 11px; }
  .evt-bell.on { background:var(--pos-bg); color:var(--pos); border-color:rgba(55,211,133,0.45); }
  .evt-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px 14px; }
  .evt-row { display:flex; align-items:center; gap:9px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:8px 11px; cursor:pointer; }
  .evt-row:hover { border-color:var(--accent-dim); }
  .evt-ic { font-size:0.85rem; flex:none; }
  .evt-nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.78rem; font-weight:600; }
  .evt-when { font-family:var(--font-mono); font-size:0.68rem; color:var(--muted); flex:none; }
  .evt-when.soon { color:var(--accent); font-weight:700; }
  .evt-when.today { background:var(--accent); color:#191307; padding:1px 7px; border-radius:999px; font-weight:700; }
  .evt-empty { font-size:0.72rem; color:var(--faint); }
  @media (max-width:600px){ .evt{padding:11px 14px 13px;} .evt-list{grid-template-columns:1fr;} }

  /* Açılış ekranı */
  #splash { position:fixed; inset:0; z-index:99; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; transition:opacity .35s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .sp-mark { width:34px; height:34px; border-radius:8px; background:var(--accent); transform:rotate(45deg);
    box-shadow:0 0 26px rgba(226,180,95,0.45); animation:sppulse 1.4s ease-in-out infinite; }
  @keyframes sppulse { 0%,100%{transform:rotate(45deg) scale(1);opacity:1;} 50%{transform:rotate(45deg) scale(0.82);opacity:0.6;} }
  #splash .sp-t { font-size:0.72rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  #splash .sp-s { font-size:0.68rem; color:var(--faint); }
  @media (prefers-reduced-motion:reduce){ #splash .sp-mark{animation:none;} }

  /* Dağılım paneli */
  .dist { background:var(--panel); border-bottom:1px solid var(--border); padding:14px 22px 16px; }
  .dist-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .dist-head .dt { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .dist-tabs { display:inline-flex; border:1px solid var(--border-strong); border-radius:11px; overflow:hidden; margin-left:auto; }
  .dist-tabs button { padding:6px 13px; background:var(--panel-2); border:none; color:var(--muted); font-size:0.7rem; font-weight:700; border-left:1px solid var(--border); }
  .dist-tabs button:first-child { border-left:none; }
  .dist-tabs button.on { background:var(--accent); color:#191307; }
  .dist-bar { display:flex; height:12px; border-radius:6px; overflow:hidden; margin-bottom:14px; background:var(--panel-2); }
  .dist-bar span { display:block; height:100%; }
  .dist-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:9px 18px; }
  .dist-row { display:flex; align-items:center; gap:9px; font-size:0.78rem; }
  .dist-row .sw { width:10px; height:10px; border-radius:3px; flex:none; }
  .dist-row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .dist-row .pc { font-family:var(--font-mono); font-weight:700; color:var(--ink); }
  .dist-row .vl { font-family:var(--font-mono); font-size:0.7rem; color:var(--faint); min-width:74px; text-align:right; }
  @media (max-width:600px){
    .dist { padding:13px 14px 15px; }
    .dist-list { grid-template-columns:1fr; gap:8px; }
    .dist-row .vl { min-width:62px; }
  }

  /* ============ ARAYÜZ 2.0 ============ */
  :root{ --bg:#06080b; --panel:#0c1016; --panel-2:#11161d; --row-hover:#161d27; --row-alt:#0c1016;
    --border:#1a212b; --border-strong:#28313d; --accent:#e2b45f; --r:14px;
    --shadow:0 12px 36px rgba(0,0,0,0.55); }
  header{ background:var(--bg); border-bottom:none; padding-bottom:4px; }
  .brand .mark{ border-radius:3px; box-shadow:0 0 14px rgba(226,180,95,0.4); }
  .btn{ border-radius:12px; }
  .btn.primary{ box-shadow:0 4px 14px rgba(226,180,95,0.25); }
  .langsel, .typesel, .pp-ccy, .range-sel{ border-radius:11px; }
  .kpis{ border-radius:12px; background:var(--panel); }
  .note-bar{ background:var(--bg); border-bottom:none; }
  .ticker{ background:var(--bg); border-top:1px solid var(--border); }
  .pp{ background:var(--bg); }
  .pp-total .val{ font-size:1.9rem; letter-spacing:-0.02em; }
  .pp-cat{ border-radius:var(--r); background:var(--panel); }
  .pp-periods{ border-radius:12px; overflow:hidden; }
  .toolbar{ border-bottom:none; }
  #search{ border-radius:11px; }
  .fchip{ border-radius:10px; }
  thead th{ background:var(--bg); border-bottom:1px solid var(--border-strong); }
  td.name-cell{ background:var(--bg); }
  tbody tr:nth-child(even){ background:transparent; }
  tbody tr:nth-child(even) td.name-cell{ background:var(--bg); }
  .modal-card{ border-radius:18px; }
  .kv-grid, .sig-list, .news-list, .cal, .stat-box, .an-box, .overall, .swing-box{ border-radius:12px; }

  /* Mobil: tablo -> kart listesi */
  @media (max-width:600px){
    table{ min-width:0; width:100%; display:block; }
    thead{ display:none; }
    tbody{ display:block; padding:4px 12px 90px; }
    tbody tr{ display:grid; grid-template-columns:1fr auto; row-gap:7px; align-items:center;
      background:var(--panel); border:1px solid var(--border); border-radius:var(--r);
      margin:0 0 9px; padding:13px 14px; }
    tbody td{ display:none; border:none; padding:0; text-align:right; background:transparent !important; }
    td.name-cell{ display:block; position:static; border-right:none; text-align:left; grid-column:1; grid-row:1; }
    tbody td:nth-child(2){ display:block; grid-column:2; grid-row:1; font-size:0.92rem; }
    tbody td:nth-child(3){ display:block; grid-column:2; grid-row:2; }
    tbody td:nth-child(5){ display:block; grid-column:1; grid-row:2; text-align:left; color:var(--muted); font-size:0.72rem; }
    tbody td:nth-child(5)::before{ content:'RSI '; color:var(--faint); font-family:var(--font-sans); font-size:0.6rem; letter-spacing:0.06em; }
    tr.group-row{ display:block; background:transparent; border:none; padding:6px 2px 2px; margin:6px 0 2px; }
    tr.group-row td{ display:block !important; position:static; background:transparent !important; border:none; padding:0; text-align:left; }
    tbody tr:hover td{ background:transparent; }
    tbody tr:active{ transform:scale(0.985); transition:transform .08s; }

    /* Detay paneli: alttan kayan sayfa */
    .drawer{ top:auto; bottom:0; height:93%; width:100%; max-width:100%;
      border-left:none; border-top:1px solid var(--border-strong);
      border-radius:20px 20px 0 0; transform:translateY(100%); }
    .drawer.show{ transform:translateY(0); }
    .drawer-head{ padding-top:22px; }
    .drawer-head::before{ content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
      width:40px; height:4px; border-radius:2px; background:var(--border-strong); }
    .drawer{ position:fixed; }
    .drawer-head{ position:relative; }
  }
</style>
</head>

<div id="splash"><div class="sp-mark"></div><div class="sp-t">Portföy</div><div class="sp-s" id="spMsg">Bağlanıyor…</div></div>

      <button class="btn" id="themeBtn">◐</button>
      <button class="btn primary" id="addBtn"><span class="plus">+</span> <span data-t="add"></span></button>

  <div class="note-bar" id="noteBar"></div>

  <div class="dist" id="distPanel" style="display:none"></div>
  <div class="evt" id="evtPanel" style="display:none"></div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" autocomplete="off" />
    </div>
    <div class="typesel" id="typesel"></div>
    <button class="btn" id="groupBtn"></button>
    <button class="btn" id="swingBtn"></button>
    <button class="btn" id="distBtn"></button>
    <div class="filters" id="filters"></div>
    <span class="count-note" id="countNote"></span>
  </div>
  <div class="table-scroll">
    <table><thead><tr id="headRow"></tr></thead><tbody id="tbody"></tbody></table>

  </div>
</div>

<!-- ANALİZ EKRANI -->

    <div class="brand"><span class="mark"></span><h1 id="anTitle">Analiz</h1></div>

</div>

</div>

  function buildSignals(c){ var f=c.fund||{}, tc=c.tech||{}, out=[]; function s(d,x){ out.push({dir:d,txt:x}); }
    if(tc.rsi!=null){ if(tc.rsi<30) s('neu',t('sigOversold',{v:tc.rsi.toFixed(0)})); else if(tc.rsi>70) s('neu',t('sigOverbought',{v:tc.rsi.toFixed(0)})); }
    if(tc.price!=null&&tc.ma50!=null&&tc.ma200!=null){ if(tc.price>tc.ma50&&tc.price>tc.ma200) s('pos',t('sigUptrend')); else if(tc.price<tc.ma50&&tc.price<tc.ma200) s('neg',t('sigDowntrend')); else s('neu',t('sigMixed')); }
    if(tc.macd&&tc.macd.hist!=null){ if(tc.macd.hist>0) s('pos',t('sigMomUp')); else s('neg',t('sigMomDown')); }
    if(tc.rangePos!=null){ if(tc.rangePos<25) s('neu',t('sigNearLow',{v:tc.rangePos.toFixed(0)})); else if(tc.rangePos>80) s('neu',t('sigNearHigh',{v:tc.rangePos.toFixed(0)})); }
    if(c.type==='stock'){
      if(f.debtEbitda!=null){ if(f.debtEbitda<=1) s('pos',t('sigLowDebt')); else if(f.debtEbitda>3) s('neg',t('sigHighDebt')); }
      if(f.profitMargin!=null){ if(f.profitMargin<0) s('neg',t('sigLoss')); else if(f.profitMargin>0.12) s('pos',t('sigProfit',{v:(f.profitMargin*100).toFixed(0)})); }

      if(f.forwardPE!=null&&f.trailingPE!=null&&f.forwardPE<f.trailingPE) s('pos',t('sigCheaperFwd'));
    }
    return out;
  }

  function drawSpark(id,arr){ var cv=document.getElementById(id); if(!cv||!arr||arr.length<2) return; var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height,pad=4; var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rng=(mx-mn)||1; var up=arr[arr.length-1]>=arr[0]; var col=getCss(up?'--pos':'--neg'); ctx.clearRect(0,0,W,H); ctx.lineWidth=1.5; ctx.strokeStyle=col; ctx.beginPath(); arr.forEach(function(v,i){ var x=pad+i/(arr.length-1)*(W-2*pad); var y=H-pad-((v-mn)/rng)*(H-2*pad); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke(); var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col+'44'); g.addColorStop(1,col+'00'); ctx.lineTo(W-pad,H-pad); ctx.lineTo(pad,H-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill(); }

  function drawBigChart(points){ var cv=document.getElementById('bigChart'); if(!cv||!points||points.length<2) return; var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height,padT=8,padB=14,padR=2;
    var vals=points.map(function(p){return p.c;}); var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
    var up=vals[vals.length-1]>=vals[0]; var col=getCss(up?'--pos':'--neg');
    var X=function(i){return i/(points.length-1)*(W-padR);}; var Y=function(v){return padT+(1-(v-mn)/rng)*(H-padT-padB);};
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=getCss('--border'); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,Y(mx)); ctx.lineTo(W,Y(mx)); ctx.moveTo(0,Y(mn)); ctx.lineTo(W,Y(mn)); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath(); points.forEach(function(p,i){ if(i===0)ctx.moveTo(X(i),Y(p.c)); else ctx.lineTo(X(i),Y(p.c)); }); ctx.stroke();
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col+'33'); g.addColorStop(1,col+'00'); ctx.lineTo(X(points.length-1),H-padB); ctx.lineTo(0,H-padB); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.fillStyle=getCss('--faint'); ctx.font='10px ui-monospace,monospace'; ctx.textAlign='right'; ctx.fillText(mx.toFixed(1),W-3,Y(mx)+10); ctx.fillText(mn.toFixed(1),W-3,Y(mn)-3);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(points.length-1),Y(vals[vals.length-1]),3,0,6.283); ctx.fill();
  }

  document.getElementById('addBtn').addEventListener('click',function(){ openModal(null); });
  document.getElementById('symSearchBtn').addEventListener('click',doSymSearch);
  document.getElementById('symSearch').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSymSearch(); } });
  document.getElementById('ssResults').addEventListener('click',function(e){ var it=e.target.closest('[data-sym]'); if(it) pickResult(it); });
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('modalCancel').addEventListener('click',closeModal);
  document.getElementById('modalSave').addEventListener('click',saveModal);
  document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  document.getElementById('themeBtn').addEventListener('click',toggleTheme);
  document.getElementById('refreshBtn').addEventListener('click',refreshAll);
  document.getElementById('autoRefresh').addEventListener('change',function(e){ setAuto(e.target.checked); });
  document.getElementById('langsel').addEventListener('click',function(e){ var b=e.target.closest('[data-lang]'); if(b) setLang(b.getAttribute('data-lang')); });
  document.getElementById('portPanel').addEventListener('click',function(e){ var b=e.target.closest('[data-ccy]'); if(b){ setCcy(b.getAttribute('data-ccy')); return; } var eb=e.target.closest('[data-eye]'); if(eb){ state.hideValues=!state.hideValues; try{localStorage.setItem('portfoyHide',state.hideValues?'1':'0');}catch(e2){} renderPanel(); renderBody(); if(currentDrawerKey) openDrawer(currentDrawerKey); } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){closeModal();closeDrawer();} });

  // ================= ANALİZ EKRANI =================
  var AN={ sym:null, name:null, fund:null, cs:null, tab:'inc', period:'quarterly' };
  function switchScreen(name){
    document.body.classList.toggle('scr-analysis', name==='analysis');
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar .tab'), function(b){
      b.classList.toggle('on', b.getAttribute('data-screen')===name); });
    window.scrollTo(0,0);
  }
  function bigNum(v,cur){
    if(v==null||isNaN(v)) return '—';
    var neg=v<0; v=Math.abs(v); var s;
    if(v>=1e12) s=(v/1e12).toFixed(2)+'T'; else if(v>=1e9) s=(v/1e9).toFixed(2)+'B';
    else if(v>=1e6) s=(v/1e6).toFixed(1)+'M'; else if(v>=1e3) s=(v/1e3).toFixed(0)+'K';
    else s=v.toFixed(0);
    return (neg?'-':'')+s+(cur?' '+cur:'');
  }
  function pctTxt(v,d){ if(v==null||isNaN(v)) return '—'; return (v>=0?'+':'')+v.toFixed(d==null?1:d)+'%'; }
  function anSearchDo(){
    var q=document.getElementById('anQuery').value.trim(); var box=document.getElementById('anResults');
    if(!q){ box.innerHTML=''; return; }
    box.innerHTML='<div class="an-item"><span class="ai-n">'+t('ssSearching')+'</span></div>';
    fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
      var items=(d&&d.items)||[];
      if(!items.length){ box.innerHTML='<div class="an-item"><span class="ai-n">'+t('ssNone')+'</span></div>'; return; }
      box.innerHTML=items.slice(0,7).map(function(it){
        return '<button class="an-item" data-pick="'+esc(it.symbol)+'" data-nm="'+esc(it.name||'')+'">'+
          '<span><span class="ai-n">'+esc(it.name||it.symbol)+'</span> <span class="ai-e">'+esc(it.exchange||'')+'</span></span>'+
          '<span class="ai-s">'+esc(it.symbol)+'</span></button>'; }).join('');
    }).catch(function(){ box.innerHTML=''; });
  }
  function anPick(sym,name){
    AN.sym=sym; AN.name=name||sym; AN.fund=null; AN.cs=null;
    document.getElementById('anResults').innerHTML='';
    document.getElementById('anQuery').value='';
    document.getElementById('anBody').innerHTML='<div class="fa-load">'+t('anLoading')+'</div>';
    Promise.all([
      fetch('/api/canslim?symbol='+encodeURIComponent(sym)).then(function(r){return r.json();}).catch(function(){return null;}),
      fetch('/api/fundamentals?symbol='+encodeURIComponent(sym)).then(function(r){return r.json();}).catch(function(){return null;})
    ]).then(function(res){
      if(AN.sym!==sym) return;
      AN.cs=(res[0]&&res[0].ok)?res[0]:null; AN.fund=(res[1]&&res[1].ok)?res[1]:null;
      renderAnalysis();
      fetch('/api/interpret?symbol='+encodeURIComponent(sym)).then(function(r){return r.json();}).then(function(ip){
        if(AN.sym!==sym) return; var box=document.getElementById('anInterp'); if(!box||!ip||!ip.text) return;
        box.innerHTML='<div class="sec-title" style="margin-top:20px">'+t('interpTitle')+'</div>'+
          '<div class="interp">'+ip.text.replace(/\n/g,'<br>')+'</div>';
      }).catch(function(){});
    });
  }
  function csLabel(code){ return t('cs_'+code); }
  function csValueText(c){
    var v=c.value, u=c.unit, ex=c.extra||{};
    if(c.code==='S') return (v!=null? bigNum(v,'') : '—')+(ex.volRatio!=null? ' · '+t('csVol')+' '+ex.volRatio.toFixed(2)+'×':'');
    if(c.code==='A') return pctTxt(v)+(ex.roe!=null? ' · ROE '+ex.roe.toFixed(1)+'%':'');
    if(c.code==='L') return pctTxt(v)+(ex.stock!=null? ' ('+pctTxt(ex.stock,0)+' vs '+pctTxt(ex.index,0)+')':'');
    if(c.code==='I') return (v!=null?v.toFixed(1)+'%':'—')+(ex.holders?' · '+ex.holders+' '+t('csHolders'):'');
    if(c.code==='M') return (v!=null? t('csAboveMa')+' '+pctTxt(v):'—');
    if(c.code==='N') return v!=null? v.toFixed(0)+'%':'—';
    return (v!=null? v.toFixed(1)+(u==='%'?'%':''):'—');
  }
  function renderAnalysis(){
    var el=document.getElementById('anBody'); if(!el) return;
    if(!AN.sym){ el.innerHTML='<div class="an-empty">'+t('anIntro')+'</div>'; return; }
    var html='';
    if(AN.cs){
      var d=AN.cs;
      html+='<div class="cs-top"><div class="cs-grade g-'+d.grade+'">'+d.grade+'</div>'+
        '<div class="cs-info"><div class="cn">'+esc(d.name||AN.name)+'</div>'+
        '<div class="cm">CAN SLIM '+t('csScore')+'</div>'+
        '<div class="cp">'+d.score+' / '+d.max+' · %'+d.pct.toFixed(0)+'</div>'+
        '<div class="cs-meter"><span style="width:'+d.pct.toFixed(0)+'%"></span></div></div></div>';
      html+='<div class="cs-list">'+d.criteria.map(function(c){
        var st=c.pass?'ok':(c.partial?'part':'no');
        return '<div class="cs-row '+(c.pass?'ok':(c.partial?'':'no'))+'">'+
          '<span class="cs-badge '+st+'">'+c.code+'</span>'+
          '<span class="cs-txt"><span class="cl">'+csLabel(c.code)+'</span>'+
          '<div class="cv">'+csValueText(c)+'</div>'+
          '<div class="ct">'+t('csTarget')+': '+esc(c.target)+'</div></span></div>'; }).join('')+'</div>';
      html+='<div class="disclaimer" style="margin-top:12px">'+t('csDisc')+'</div>';
      html+='<div id="anInterp"></div>';
    } else {
      html+='<div class="an-empty">'+t('anNoData')+'</div>';
    }
    if(AN.fund){
      var tabs=[['inc','faInc'],['bal','faBal'],['cf','faCf'],['earn','faEarn'],['prof','faProf']];
      html+='<div class="fa-tabs">'+tabs.map(function(p){
        return '<button data-fa="'+p[0]+'" class="'+(AN.tab===p[0]?'on':'')+'">'+t(p[1])+'</button>'; }).join('')+'</div>';
      html+=renderFaBody();
    }
    el.innerHTML=html;
  }
  function renderFaBody(){
    var f=AN.fund; if(!f) return '';
    var cur=f.currency||'';
    if(AN.tab==='prof'){
      var p=f.profile||{}, r=f.ratios||{};
      function row(l,v){ return v?('<div class="fp-r"><span>'+l+'</span><span>'+esc(v)+'</span></div>'):''; }
      return '<div class="fa-prof">'+
        row(t('fpSector'), p.sector)+row(t('fpIndustry'), p.industry)+
        row(t('fpEmployees'), p.employees!=null?String(p.employees):'')+
        row(t('fpCountry'), p.country)+row(t('fpCap'), bigNum(r.marketCap,f.tradeCurrency||''))+
        row(t('fpWeb'), p.website)+
        (p.summary?'<div class="fp-s">'+esc(p.summary)+'</div>':'')+'</div>';
    }
    if(AN.tab==='earn'){
      var eh=f.earningsHistory||[];
      if(!eh.length) return '<div class="an-empty">'+t('anNoData')+'</div>';
      return '<div class="fa-scroll"><table class="fa"><thead><tr><th>'+t('faQuarter')+'</th><th>'+t('faEst')+'</th><th>'+t('faAct')+'</th><th>'+t('faSurprise')+'</th></tr></thead><tbody>'+
        eh.map(function(e){ var sp=e.surprisePct!=null?e.surprisePct*100:null;
          var cls=sp==null?'':(sp>=0?'pos':'neg');
          return '<tr><td>'+esc(e.quarter||'—')+'</td><td>'+(e.estimate!=null?e.estimate.toFixed(2):'—')+
            '</td><td>'+(e.actual!=null?e.actual.toFixed(2):'—')+'</td><td class="'+cls+'">'+
            (sp!=null?pctTxt(sp,1):'—')+'</td></tr>'; }).join('')+'</tbody></table></div>'+
        '<div class="fa-note">'+t('faEarnNote')+'</div>';
    }
    var map={inc:['income',[['totalRevenue','fiRev'],['grossProfit','fiGross'],['operatingIncome','fiOp'],['netIncome','fiNet']]],
             bal:['balance',[['totalAssets','fiAssets'],['totalLiab','fiLiab'],['totalStockholderEquity','fiEquity'],['cash','fiCash'],['longTermDebt','fiDebt']]],
             cf:['cashflow',[['totalCashFromOperatingActivities','fiOpCf'],['capitalExpenditures','fiCapex'],['dividendsPaid','fiDiv']]]};
    var cfg=map[AN.tab]; if(!cfg) return '';
    var data=(f[cfg[0]]||{})[AN.period]||[];
    if(!data.length){ data=(f[cfg[0]]||{}).annual||[]; }
    if(!data.length) return '<div class="an-empty">'+t('anNoData')+'</div>';
    var head='<tr><th>'+t('faItem')+'</th>'+data.map(function(d){return '<th>'+esc((d.date||'').slice(0,7))+'</th>';}).join('')+'</tr>';
    // Yahoo bazı alanları boş/sıfır döndürür — tamamen boş satırları gösterme
    var body=cfg[1].filter(function(fl){
      return data.some(function(d){ var v=d[fl[0]]; return v!=null && !isNaN(v) && v!==0; });
    }).map(function(fl){
      return '<tr><td>'+t(fl[1])+'</td>'+data.map(function(d){ return '<td>'+bigNum(d[fl[0]],'')+'</td>'; }).join('')+'</tr>';
    }).join('');
    if(!body) return '<div class="an-empty">'+t('anNoData')+'</div>';
    return '<div style="display:flex;gap:6px;margin-bottom:9px">'+
        ['quarterly','annual'].map(function(p){ return '<button class="fa-per btn'+(AN.period===p?' primary':'')+'" data-per="'+p+'" style="padding:5px 11px;font-size:0.68rem">'+t(p==='quarterly'?'faQ':'faY')+'</button>'; }).join('')+'</div>'+
      '<div class="fa-scroll"><table class="fa"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
      '<div class="fa-note">'+t('faUnit',{c:cur})+'</div>';
  }
  document.getElementById('tabbar').addEventListener('click',function(e){
    var b=e.target.closest('[data-screen]'); if(b) switchScreen(b.getAttribute('data-screen')); });
  document.getElementById('anGo').addEventListener('click',anSearchDo);
  document.getElementById('anQuery').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); anSearchDo(); } });
  document.getElementById('anResults').addEventListener('click',function(e){
    var b=e.target.closest('[data-pick]'); if(b) anPick(b.getAttribute('data-pick'), b.getAttribute('data-nm')); });
  document.getElementById('anQuick').addEventListener('click',function(e){
    var b=e.target.closest('[data-qs]'); if(b) anPick(b.getAttribute('data-qs'), b.getAttribute('data-qn')); });
  document.getElementById('anBody').addEventListener('click',function(e){
    var t1=e.target.closest('[data-fa]'); if(t1){ AN.tab=t1.getAttribute('data-fa'); renderAnalysis(); return; }
    var t2=e.target.closest('[data-per]'); if(t2){ AN.period=t2.getAttribute('data-per'); renderAnalysis(); } });
  function renderAnQuick(){
    var el=document.getElementById('anQuick'); if(!el) return;
    var ks=Object.keys(state.companies).filter(function(k){ var c=state.companies[k]; return c.type==='stock'&&c.ysym; }).slice(0,6);
    el.innerHTML=ks.map(function(k){ var c=state.companies[k];
      return '<button data-qs="'+esc(c.ysym)+'" data-qn="'+esc(c.name)+'">'+esc(c.name)+'</button>'; }).join('');
  }

  // Açılış ekranı: ilk fiyatlar gelince ya da en geç 6 sn sonra kapan
  var splashDone=false;
  function hideSplash(){ if(splashDone) return; splashDone=true;
    var s=document.getElementById('splash'); if(!s) return;
    s.classList.add('hide'); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 400);
  }
  (function watchSplash(){
    var msg=document.getElementById('spMsg');
    var iv=setInterval(function(){
      var live=Object.keys(state.companies).filter(function(k){var l=state.companies[k].live;return l&&l.status==='live';}).length;
      if(msg) msg.textContent = live ? (live+' / '+Object.keys(state.companies).length) : 'Bağlanıyor…';
      if(live>=Math.min(8, Object.keys(state.companies).length)){ clearInterval(iv); hideSplash(); }
    }, 250);
    setTimeout(function(){ clearInterval(iv); hideSplash(); }, 6000);
  })();

  render(); renderAnalysis(); renderAnQuick(); loadFx(); refreshAll();
  // Bildirim takibi için sembolleri sunucuya bildir
  setTimeout(function(){ try{
    var syms=Object.keys(state.companies).filter(function(k){var c=state.companies[k];return c.ysym&&c.type==='stock';}).map(function(k){return state.companies[k].ysym;});
    if(syms.length) fetch('/api/watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms})}).catch(function(){});
  }catch(e){} }, 12000);
  setTimeout(notifyDue, 9000);                 // açılışta bir kez kontrol
  setInterval(notifyDue, 30*60*1000);          // sonra yarım saatte bir
})();
</script>
</body>
