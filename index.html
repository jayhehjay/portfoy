<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portföy · Canlı</title>
<style>
  :root {
    --bg:#0a0d11; --panel:#10151b; --panel-2:#151c24; --row-hover:#1a2330; --row-alt:#0e1319;
    --border:#1e2833; --border-strong:#2a3644; --ink:#ecf1f7; --muted:#8b9aab; --faint:#57626e;
    --accent:#e6b45c; --accent-dim:#ab8340; --pos:#37d385; --pos-bg:rgba(55,211,133,0.11);
    --neg:#f4685c; --neg-bg:rgba(244,104,92,0.11); --flat:#8b9aab; --live:#37d385;
    --etf:#5fa8e6; --etf-bg:rgba(95,168,230,0.14); --fund:#b98be0; --fund-bg:rgba(185,139,224,0.14);
    --shadow:0 14px 48px rgba(0,0,0,0.55);
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
  }
  :root[data-theme="light"] {
    --bg:#eef0f4; --panel:#fff; --panel-2:#f5f7fa; --row-hover:#edf1f6; --row-alt:#f8fafc;
    --border:#dde3ea; --border-strong:#c5cfda; --ink:#0d141b; --muted:#52616f; --faint:#8a95a1;
    --accent:#a97817; --accent-dim:#c69a3c; --pos:#0e8447; --pos-bg:rgba(14,132,71,0.09);
    --neg:#c93327; --neg-bg:rgba(201,51,39,0.09); --flat:#52616f; --live:#0e8447;
    --etf:#2b6cb0; --etf-bg:rgba(43,108,176,0.10); --fund:#7c4bb0; --fund-bg:rgba(124,75,176,0.10);
    --shadow:0 14px 44px rgba(18,28,42,0.15);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button,input,select { font-family:inherit; color:inherit; font-size:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .pos { color:var(--pos); } .neg { color:var(--neg); } .flat { color:var(--flat); }
  .shell { min-height:100vh; display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:16px; padding:13px 22px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border-bottom:1px solid var(--border-strong); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark { width:10px; height:10px; border-radius:2px; background:var(--accent); transform:rotate(45deg); box-shadow:0 0 12px rgba(230,180,92,0.35); }
  .brand h1 { margin:0; font-size:0.95rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; }
  .brand .tag { font-size:0.6rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); font-weight:600; border:1px solid var(--accent-dim); border-radius:4px; padding:2px 7px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--live); display:inline-block; animation:pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(55,211,133,0.5);} 70%{box-shadow:0 0 0 6px rgba(55,211,133,0);} 100%{box-shadow:0 0 0 0 rgba(55,211,133,0);} }
  @media (prefers-reduced-motion:reduce){ .live-dot{animation:none;} }
  .status-line { display:flex; align-items:center; gap:8px; font-size:0.72rem; color:var(--muted); }
  .status-line .mono { color:var(--ink); }
  .kpis { display:flex; margin-left:auto; border:1px solid var(--border); border-radius:8px; background:var(--panel); overflow:hidden; }
  .kpi { padding:7px 14px; text-align:right; min-width:70px; border-left:1px solid var(--border); }
  .kpi:first-child { border-left:none; }
  .kpi .v { display:block; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.0rem; font-weight:650; line-height:1.1; }
  .kpi .v.accent { color:var(--accent); }
  .kpi .k { display:block; font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); margin-top:3px; }
  .hbtns { display:flex; gap:8px; align-items:center; }
  .langsel { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; }
  .langsel button { padding:6px 9px; background:var(--panel-2); border:none; color:var(--muted); font-size:0.68rem; font-weight:700; border-left:1px solid var(--border); }
  .langsel button:first-child { border-left:none; }
  .langsel button.on { background:var(--accent); color:#191307; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:7px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--ink); font-size:0.74rem; font-weight:600; transition:background .12s,border-color .12s; }
  .btn:hover { background:var(--row-hover); border-color:var(--accent-dim); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#191307; }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn .plus { font-size:1rem; line-height:0.7; }
  .switch { display:inline-flex; align-items:center; gap:6px; font-size:0.72rem; color:var(--muted); user-select:none; }
  .switch input { width:30px; height:16px; -webkit-appearance:none; appearance:none; background:var(--border-strong); border-radius:10px; position:relative; cursor:pointer; transition:background .15s; }
  .switch input:checked { background:var(--accent); }
  .switch input::after { content:""; position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s; }
  .switch input:checked::after { left:16px; }

  .note-bar { padding:7px 22px; background:var(--panel-2); border-bottom:1px solid var(--border); font-size:0.67rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .note-bar b { color:var(--accent); font-weight:700; }
  .pp { display:flex; align-items:center; gap:18px; padding:12px 22px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .pp-total { display:flex; flex-direction:column; gap:2px; }
  .pp-total .lbl { font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); }
  .pp-total .val { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.55rem; font-weight:700; line-height:1; }
  .pp-total .chg { font-family:var(--font-mono); font-size:0.76rem; font-weight:600; margin-top:2px; }
  .pp-cats { display:flex; gap:8px; flex-wrap:wrap; }
  .pp-cat { border:1px solid var(--border); border-radius:8px; padding:7px 12px; background:var(--panel); min-width:118px; }
  .pp-cat .c-top { display:flex; align-items:center; gap:6px; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; }
  .pp-cat .dot { width:7px; height:7px; border-radius:50%; }
  .pp-cat .dot.stock { background:var(--live); } .pp-cat .dot.etf { background:var(--etf); } .pp-cat .dot.fund { background:var(--fund); }
  .pp-cat .c-val { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.95rem; font-weight:700; margin-top:3px; }
  .pp-cat .c-pct { font-size:0.62rem; color:var(--faint); font-family:var(--font-mono); }
  .pp-periods { display:flex; gap:2px; margin-left:auto; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .pp-per { padding:6px 13px; text-align:center; border-left:1px solid var(--border); background:var(--panel); }
  .pp-per:first-child { border-left:none; }
  .pp-per .pl { font-size:0.55rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--faint); }
  .pp-per .pv { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.82rem; font-weight:700; margin-top:2px; }
  .pp-per .pv.dim { color:var(--faint); font-weight:400; }
  .pp-ccy { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; }
  .pp-ccy button { padding:6px 10px; background:var(--panel); border:none; color:var(--muted); font-size:0.68rem; font-weight:700; border-left:1px solid var(--border); }
  .pp-ccy button:first-child { border-left:none; }
  .pp-ccy button.on { background:var(--accent); color:#191307; }
  .pp-eye { border:1px solid var(--border-strong); border-radius:7px; background:var(--panel); color:var(--muted); font-size:0.9rem; padding:5px 9px; line-height:1; }
  .pp-eye:hover { border-color:var(--accent-dim); }

  .toolbar { display:flex; align-items:center; gap:10px; padding:10px 22px; background:var(--bg); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--faint); }
  #search { width:210px; max-width:55vw; padding:7px 10px 7px 28px; border-radius:7px; border:1px solid var(--border-strong); background:var(--panel); }
  #search::placeholder { color:var(--faint); }
  .typesel { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; }
  .typesel button { padding:6px 11px; background:var(--panel); border:none; color:var(--muted); font-size:0.7rem; font-weight:700; border-left:1px solid var(--border); }
  .typesel button:first-child { border-left:none; }
  .typesel button.on { background:var(--accent); color:#191307; }
  .filters { display:flex; gap:5px; flex-wrap:wrap; }
  .fchip { padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:0.7rem; font-weight:600; }
  .fchip:hover { border-color:var(--accent-dim); color:var(--ink); }
  .fchip.on { background:var(--accent); border-color:var(--accent); color:#191307; }
  .count-note { margin-left:auto; font-size:0.7rem; color:var(--faint); font-family:var(--font-mono); }

  .table-scroll { flex:1; overflow:auto; }
  table { border-collapse:collapse; width:100%; min-width:1300px; }
  thead th { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--border-strong); color:var(--muted); font-size:0.6rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; text-align:right; padding:10px 11px; white-space:nowrap; cursor:pointer; user-select:none; }
  thead th.left { text-align:left; }
  thead th:hover { color:var(--ink); }
  thead th .arrow { color:var(--accent); font-size:0.72rem; margin-left:3px; }
  thead th .arrow.idle { color:var(--faint); opacity:0.45; font-size:0.62rem; }
  thead th.sticky-name { left:0; z-index:3; }
  tbody td { padding:9px 11px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.78rem; }
  tbody tr { cursor:pointer; }
  tbody tr:nth-child(even) { background:var(--row-alt); }
  tbody tr:hover td { background:var(--row-hover); }
  td.name-cell { text-align:left; position:sticky; left:0; background:var(--panel); z-index:1; font-family:var(--font-sans); border-right:1px solid var(--border); }
  tbody tr:hover td.name-cell { background:var(--row-hover); }
  tbody tr:nth-child(even) td.name-cell { background:var(--panel-2); }
  tbody tr:nth-child(even):hover td.name-cell { background:var(--row-hover); }
  .nm { font-weight:600; color:var(--ink); }
  .nm-sub { font-size:0.65rem; color:var(--faint); font-family:var(--font-sans); margin-top:1px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .nm-sub .tk { font-family:var(--font-mono); color:var(--accent-dim); font-weight:600; }
  .badge { font-size:0.55rem; letter-spacing:0.05em; text-transform:uppercase; padding:1px 5px; border-radius:3px; font-weight:700; font-family:var(--font-sans); }
  .badge.live { background:var(--pos-bg); color:var(--live); }
  .badge.loading { background:var(--panel-2); color:var(--muted); }
  .badge.err { background:var(--neg-bg); color:var(--neg); }
  .tbadge { font-size:0.54rem; letter-spacing:0.04em; text-transform:uppercase; padding:1px 5px; border-radius:3px; font-weight:700; }
  .tbadge.stock { background:var(--pos-bg); color:var(--live); }
  .tbadge.etf { background:var(--etf-bg); color:var(--etf); }
  .tbadge.fund { background:var(--fund-bg); color:var(--fund); }
  .tbadge.index { background:rgba(230,180,92,0.15); color:var(--accent); }
  td.left { text-align:left; font-family:var(--font-sans); }
  .sector-tag { font-size:0.66rem; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:2px 7px; background:var(--panel); }
  .price-main { font-weight:700; color:var(--ink); }
  .chg { display:inline-block; padding:2px 7px; border-radius:5px; font-weight:700; min-width:56px; text-align:right; }
  .chg.pos { background:var(--pos-bg); color:var(--pos); } .chg.neg { background:var(--neg-bg); color:var(--neg); } .chg.flat { color:var(--flat); }
  .earn { display:inline-flex; align-items:baseline; gap:6px; justify-content:flex-end; }
  .earn .mo { color:var(--ink); font-weight:600; }
  .earn .cd { font-size:0.6rem; letter-spacing:0.04em; text-transform:uppercase; padding:2px 7px; border-radius:4px; background:var(--panel-2); color:var(--muted); font-family:var(--font-sans); font-weight:600; }
  .earn .cd.soon { background:var(--accent); color:#191307; }
  .earn .cd.mid { color:var(--accent); background:transparent; border:1px solid var(--accent-dim); }
  .dim { color:var(--faint); }
  td .rm { background:none; border:none; color:var(--faint); font-size:0.8rem; padding:2px 5px; border-radius:4px; opacity:0; transition:opacity .1s; }
  tbody tr:hover .rm { opacity:1; }
  td .rm:hover { color:var(--neg); background:var(--neg-bg); }
  .empty { padding:60px 20px; text-align:center; color:var(--faint); }
  tr.group-row { cursor:pointer; }
  tr.group-row td { position:sticky; left:0; background:var(--panel-2); border-bottom:1px solid var(--border-strong); border-top:1px solid var(--border-strong); padding:8px 14px; font-family:var(--font-sans); text-align:left; }
  tr.group-row:hover td { background:var(--row-hover); }
  .grp { display:flex; align-items:center; gap:10px; }
  .grp .chev { color:var(--faint); font-size:0.7rem; width:12px; display:inline-block; transition:transform .12s; }
  .grp.collapsed .chev { transform:rotate(-90deg); }
  .grp .flag { font-size:1rem; }
  .grp .gname { font-weight:700; font-size:0.82rem; }
  .grp .gcount { font-size:0.62rem; color:var(--muted); background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:1px 8px; }
  .grp .gval { margin-left:auto; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:0.82rem; }
  .grp .gday { font-family:var(--font-mono); font-size:0.72rem; font-weight:600; min-width:56px; text-align:right; }
  .btn.on { background:var(--accent); border-color:var(--accent); color:#191307; }
  .swing-b { font-size:0.7rem; }
  .chart-wrap { margin:14px 0 4px; }
  .chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .chart-head .ct { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .range-sel { display:inline-flex; border:1px solid var(--border-strong); border-radius:6px; overflow:hidden; }
  .range-sel button { padding:4px 9px; background:var(--panel-2); border:none; color:var(--muted); font-size:0.64rem; font-weight:700; border-left:1px solid var(--border); }
  .range-sel button:first-child { border-left:none; }
  .range-sel button.on { background:var(--accent); color:#191307; }
  #bigChart { border:1px solid var(--border); border-radius:8px; background:var(--panel); }
  .swing-box { border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin:4px 0 10px; background:var(--panel-2); }
  .swing-box.ok { border-color:var(--accent-dim); background:linear-gradient(180deg,var(--panel-2),rgba(230,180,92,0.06)); }
  .sw-h { font-size:0.8rem; font-weight:600; display:flex; align-items:center; gap:6px; }
  .sw-h b { color:var(--accent); }
  .sw-tag { font-size:0.56rem; text-transform:uppercase; letter-spacing:0.06em; background:var(--accent); color:#191307; padding:1px 7px; border-radius:999px; font-weight:700; }
  .sw-reasons { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .sw-r { font-size:0.64rem; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .sw-r.pos { border-color:rgba(55,211,133,0.4); color:var(--pos); } .sw-r.neg { border-color:rgba(244,104,92,0.4); color:var(--neg); }
  .pos-line { display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px; border:1px solid var(--accent-dim); border-radius:8px; background:rgba(230,180,92,0.06); font-size:0.78rem; }
  .pos-line span:first-child { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--faint); }
  .pos-line b { font-family:var(--font-mono); color:var(--ink); }
  .pos-line .pl-lbl { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--faint); }
  .pos-line .pl-unit { color:var(--muted); font-size:0.72rem; }
  .pos-input { width:82px; padding:5px 8px; border-radius:6px; border:1px solid var(--accent-dim); background:var(--panel); color:var(--ink); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:0.9rem; text-align:right; }
  .pos-input:focus { outline:2px solid var(--accent); outline-offset:0; }
  .pos-line .pos-val { margin-left:auto; font-family:var(--font-mono); font-weight:700; color:var(--accent); }
  .analyst { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .an-box { border:1px solid var(--border); border-radius:8px; padding:11px 13px; }
  .an-box.pos { border-color:rgba(55,211,133,0.45); background:linear-gradient(180deg,var(--panel),rgba(55,211,133,0.05)); }
  .an-box.neg { border-color:rgba(244,104,92,0.45); background:linear-gradient(180deg,var(--panel),rgba(244,104,92,0.05)); }
  .an-box .an-lbl { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--faint); }
  .an-box .an-val { font-size:1.15rem; font-weight:700; margin-top:3px; font-family:var(--font-mono); }
  .an-box .an-sub { font-size:0.66rem; color:var(--muted); margin-top:3px; font-family:var(--font-mono); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); opacity:0; pointer-events:none; transition:opacity .18s; z-index:40; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:420px; max-width:92vw; background:var(--panel); border-left:1px solid var(--border-strong); box-shadow:var(--shadow); transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:41; display:flex; flex-direction:column; }
  .drawer.show { transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .drawer,.overlay{transition:none;} }
  .drawer-head { padding:18px 20px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .drawer-head h2 { margin:0; font-size:1.15rem; font-weight:700; }
  .drawer-head .sub { color:var(--muted); font-size:0.75rem; margin-top:3px; }
  .drawer-close { background:none; border:1px solid var(--border); border-radius:6px; color:var(--muted); width:28px; height:28px; flex:none; font-size:0.9rem; }
  .drawer-close:hover { color:var(--ink); border-color:var(--border-strong); }
  .drawer-body { padding:16px 20px 30px; overflow-y:auto; }
  .price-banner { display:flex; justify-content:space-between; align-items:flex-end; padding:14px 16px; border-radius:10px; margin-bottom:8px; background:var(--panel-2); border:1px solid var(--border); }
  .price-banner .p { font-family:var(--font-mono); font-size:1.9rem; font-weight:700; line-height:1; }
  .price-banner .sub { font-size:0.62rem; color:var(--faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }
  .price-banner .chg { font-size:0.95rem; }
  .src-line { font-size:0.64rem; color:var(--faint); margin:8px 2px 4px; display:flex; align-items:center; gap:6px; }
  .sec-title { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:20px 0 9px; }
  .sec-title .muted-note { color:var(--faint); font-weight:400; text-transform:none; letter-spacing:0; }
  .overall { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2); margin-bottom:4px; }

    var reasons=[], score=0, p=tc.price;

    var rsiOk = tc.rsi>=42 && tc.rsi<=56; if(rsiOk){ score++; reasons.push({dir:'pos',key:'swRsi',v:tc.rsi.toFixed(0)}); }
    var nearMa50 = tc.ma50>0 && Math.abs(p-tc.ma50)/tc.ma50<=0.05; if(nearMa50){ score++; reasons.push({dir:'pos',key:'swNearMa'}); }

  function drawBigChart(points){ var cv=document.getElementById('bigChart'); if(!cv||!points||points.length<2) return; var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height,padT=8,padB=14,padR=2;
    var vals=points.map(function(p){return p.c;}); var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
    var up=vals[vals.length-1]>=vals[0]; var col=getCss(up?'--pos':'--neg');
    var X=function(i){return i/(points.length-1)*(W-padR);}; var Y=function(v){return padT+(1-(v-mn)/rng)*(H-padT-padB);};
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=getCss('--border'); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,Y(mx)); ctx.lineTo(W,Y(mx)); ctx.moveTo(0,Y(mn)); ctx.lineTo(W,Y(mn)); ctx.stroke();

    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col+'33'); g.addColorStop(1,col+'00'); ctx.lineTo(X(points.length-1),H-padB); ctx.lineTo(0,H-padB); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.fillStyle=getCss('--faint'); ctx.font='10px ui-monospace,monospace'; ctx.textAlign='right'; ctx.fillText(mx.toFixed(1),W-3,Y(mx)+10); ctx.fillText(mn.toFixed(1),W-3,Y(mn)-3);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(points.length-1),Y(vals[vals.length-1]),3,0,6.283); ctx.fill();

  document.getElementById('search').addEventListener('input',function(e){ state.search=e.target.value; renderBody(); });
  document.getElementById('typesel').addEventListener('click',function(e){ var b=e.target.closest('[data-type]'); if(!b) return; state.typeF=b.getAttribute('data-type'); state.sector='all'; render(); });
  document.getElementById('filters').addEventListener('click',function(e){ var b=e.target.closest('[data-sector]'); if(!b) return; state.sector=b.getAttribute('data-sector'); render(); });
  document.getElementById('headRow').addEventListener('click',function(e){ var th=e.target.closest('[data-sort]'); if(!th) return; var key=th.getAttribute('data-sort'); if(state.sortKey===key) state.sortDir*=-1; else { state.sortKey=key; state.sortDir=(key==='name'||key==='sector'||key==='next'||key==='pe'||key==='debtX')?1:-1; } render(); });
  document.getElementById('tbody').addEventListener('click',function(e){ var gr=e.target.closest('[data-group]'); if(gr){ var fl=gr.getAttribute('data-group'); state.collapsed[fl]=!state.collapsed[fl]; renderBody(); return; } var rm=e.target.closest('[data-rm]'); if(rm){e.stopPropagation();removeCompany(rm.getAttribute('data-rm'));return;} var tr=e.target.closest('[data-key]'); if(tr) openDrawer(tr.getAttribute('data-key')); });
  document.getElementById('groupBtn').addEventListener('click',function(){ state.groupBy=state.groupBy==='country'?'none':'country'; try{localStorage.setItem('portfoyGroup',state.groupBy);}catch(e){} render(); });
  document.getElementById('swingBtn').addEventListener('click',function(){ state.swingOnly=!state.swingOnly; if(state.swingOnly){ state.typeF='all'; state.sector='all'; } render(); });
  document.getElementById('overlay').addEventListener('click',closeDrawer);
  document.getElementById('drawer').addEventListener('input',function(e){ var inp=e.target.closest('.pos-input'); if(!inp) return; var k=inp.getAttribute('data-antal-for'); var c=state.companies[k]; if(!c) return; var v=parseFloat(String(inp.value).replace(',','.')); if(isNaN(v)||v<0){ c.antal=null; c.qty=null; } else { c.antal=v; c.qty=v; } persist(); renderRow(k); renderPanel(); var l=c.live||{}; var pv=document.getElementById('posVal'); if(pv) pv.textContent=(c.qty!=null&&l.status==='live'&&l.price!=null)?('≈ '+fmtMoney(c.qty*l.price*sekPerCcy(l.currency))):''; });
  document.getElementById('drawer').addEventListener('click',function(e){ if(e.target.closest('[data-close]')){closeDrawer();return;}
    var rb=e.target.closest('[data-range]'); if(rb){ state.chartRange=rb.getAttribute('data-range'); Array.prototype.forEach.call(document.querySelectorAll('#rangeSel button'),function(b){ b.classList.toggle('on',b===rb); }); if(currentDrawerKey) loadChart(currentDrawerKey); return; } var rf=e.target.closest('[data-refresh]'); if(rf){var k=rf.getAttribute('data-refresh'); var c=state.companies[k]; var q=[{k:k,kind:'q'}]; if(c.type==='stock')q.push({k:k,kind:'f'}); q.push({k:k,kind:'tech'}); enqueue(q);return;} var ed=e.target.closest('[data-edit]'); if(ed){var k2=ed.getAttribute('data-edit');closeDrawer();openModal(k2);return;} var rm=e.target.closest('[data-remove]'); if(rm) removeCompany(rm.getAttribute('data-remove')); });
  document.getElementById('addBtn').addEventListener('click',function(){ openModal(null); });
  document.getElementById('symSearchBtn').addEventListener('click',doSymSearch);
  document.getElementById('symSearch').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSymSearch(); } });
  document.getElementById('ssResults').addEventListener('click',function(e){ var it=e.target.closest('[data-sym]'); if(it) pickResult(it); });
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('modalCancel').addEventListener('click',closeModal);
  document.getElementById('modalSave').addEventListener('click',saveModal);
  document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  document.getElementById('themeBtn').addEventListener('click',toggleTheme);
  document.getElementById('refreshBtn').addEventListener('click',refreshAll);
  document.getElementById('autoRefresh').addEventListener('change',function(e){ setAuto(e.target.checked); });
  document.getElementById('langsel').addEventListener('click',function(e){ var b=e.target.closest('[data-lang]'); if(b) setLang(b.getAttribute('data-lang')); });
  document.getElementById('portPanel').addEventListener('click',function(e){ var b=e.target.closest('[data-ccy]'); if(b){ setCcy(b.getAttribute('data-ccy')); return; } var eb=e.target.closest('[data-eye]'); if(eb){ state.hideValues=!state.hideValues; try{localStorage.setItem('portfoyHide',state.hideValues?'1':'0');}catch(e2){} renderPanel(); renderBody(); if(currentDrawerKey) openDrawer(currentDrawerKey); } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){closeModal();closeDrawer();} });

  render(); loadFx(); refreshAll();
})();
</script>
</body>
</html>
