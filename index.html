  .fa-load { color:var(--faint); font-size:0.8rem; padding:26px 4px; text-align:center; }

  @media (max-width:600px){
    .an-header { padding:12px 14px 4px; padding-top:max(12px, env(safe-area-inset-top)); }
    .an-search { padding:4px 14px 12px; }
    .an-body { padding:14px 14px 20px; }
    .cs-list { grid-template-columns:1fr; }
    .cs-top { padding:14px; gap:13px; }
    .cs-grade { width:56px; height:56px; font-size:1.6rem; }
  }

  /* Yaklaşan olaylar */
  .evt { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 22px 14px; }
  .evt-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .evt-head .et { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .evt-bell { margin-left:auto; border:1px solid var(--border-strong); border-radius:9px; background:var(--panel-2); color:var(--muted); font-size:0.68rem; font-weight:700; padding:5px 11px; }
  .evt-bell.on { background:var(--pos-bg); color:var(--pos); border-color:rgba(55,211,133,0.45); }
  .evt-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px 14px; }
  .evt-row { display:flex; align-items:center; gap:9px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:8px 11px; cursor:pointer; }
  .evt-row:hover { border-color:var(--accent-dim); }
  .evt-ic { font-size:0.85rem; flex:none; }
  .evt-nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.78rem; font-weight:600; }
  .evt-when { font-family:var(--font-mono); font-size:0.68rem; color:var(--muted); flex:none; }
  .evt-when.soon { color:var(--accent); font-weight:700; }
  .evt-when.today { background:var(--accent); color:#191307; padding:1px 7px; border-radius:999px; font-weight:700; }
  .evt-empty { font-size:0.72rem; color:var(--faint); }
  @media (max-width:600px){ .evt{padding:11px 14px 13px;} .evt-list{grid-template-columns:1fr;} }

  /* Açılış ekranı */
  #splash { position:fixed; inset:0; z-index:99; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; transition:opacity .35s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .sp-mark { width:34px; height:34px; border-radius:8px; background:var(--accent); transform:rotate(45deg);
    box-shadow:0 0 26px rgba(226,180,95,0.45); animation:sppulse 1.4s ease-in-out infinite; }
  @keyframes sppulse { 0%,100%{transform:rotate(45deg) scale(1);opacity:1;} 50%{transform:rotate(45deg) scale(0.82);opacity:0.6;} }
  #splash .sp-t { font-size:0.72rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  #splash .sp-s { font-size:0.68rem; color:var(--faint); }
  @media (prefers-reduced-motion:reduce){ #splash .sp-mark{animation:none;} }

  /* Dağılım paneli */
  .dist { background:var(--panel); border-bottom:1px solid var(--border); padding:14px 22px 16px; }
  .dist-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .dist-head .dt { font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .dist-tabs { display:inline-flex; border:1px solid var(--border-strong); border-radius:11px; overflow:hidden; margin-left:auto; }
  .dist-tabs button { padding:6px 13px; background:var(--panel-2); border:none; color:var(--muted); font-size:0.7rem; font-weight:700; border-left:1px solid var(--border); }
  .dist-tabs button:first-child { border-left:none; }
  .dist-tabs button.on { background:var(--accent); color:#191307; }
  .dist-bar { display:flex; height:12px; border-radius:6px; overflow:hidden; margin-bottom:14px; background:var(--panel-2); }
  .dist-bar span { display:block; height:100%; }
  .dist-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:9px 18px; }
  .dist-row { display:flex; align-items:center; gap:9px; font-size:0.78rem; }
  .dist-row .sw { width:10px; height:10px; border-radius:3px; flex:none; }
  .dist-row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .dist-row .pc { font-family:var(--font-mono); font-weight:700; color:var(--ink); }
  .dist-row .vl { font-family:var(--font-mono); font-size:0.7rem; color:var(--faint); min-width:74px; text-align:right; }
  @media (max-width:600px){
    .dist { padding:13px 14px 15px; }
    .dist-list { grid-template-columns:1fr; gap:8px; }
    .dist-row .vl { min-width:62px; }
  }

  /* ============ ARAYÜZ 2.0 ============ */
  header{ background:var(--bg); border-bottom:none; padding-bottom:4px; padding-top:max(13px, env(safe-area-inset-top)); }
  .brand .mark{ border-radius:3px; box-shadow:0 0 14px rgba(226,180,95,0.4); }
  .btn{ border-radius:12px; }
  .btn.primary{ box-shadow:0 4px 14px rgba(226,180,95,0.25); }
  .langsel, .typesel, .pp-ccy, .range-sel{ border-radius:11px; }
  .kpis{ border-radius:12px; background:var(--panel); }
  .note-bar{ background:var(--bg); border-bottom:none; }
  .ticker{ background:var(--bg); border-top:1px solid var(--border); }
  .pp{ background:var(--bg); }
  .pp-total .val{ font-size:1.9rem; letter-spacing:-0.02em; }
  .pp-cat{ border-radius:var(--r); background:var(--panel); }
  .pp-periods{ border-radius:12px; overflow:hidden; }
  .toolbar{ border-bottom:none; }
  #search{ border-radius:11px; }
  .fchip{ border-radius:10px; }
  thead th{ background:var(--bg); border-bottom:1px solid var(--border-strong); }
  td.name-cell{ background:var(--bg); }
  tbody tr:nth-child(even){ background:transparent; }
  tbody tr:nth-child(even) td.name-cell{ background:var(--bg); }
  .modal-card{ border-radius:18px; }
  .kv-grid, .sig-list, .news-list, .cal, .stat-box, .an-box, .overall, .swing-box{ border-radius:12px; }

  /* Mobil: kart listesi YALNIZCA cam görünümde (terminal görünümü tablo kullanır) */
  @media (max-width:600px){
    :root[data-skin="glass"] tbody td:nth-child(5)::before{ content:'RSI '; color:var(--faint);
      font-family:var(--font-sans); font-size:0.6rem; letter-spacing:0.06em; }
    :root[data-skin="glass"] tbody tr:active{ transform:scale(0.985); transition:transform .08s; }

    /* Detay paneli: alttan kayan sayfa */
    .drawer{ top:auto; bottom:0; height:93%; width:100%; max-width:100%;
      border-left:none; border-top:1px solid var(--border-strong);
      border-radius:20px 20px 0 0; transform:translateY(100%); }
    .drawer.show{ transform:translateY(0); }
    .drawer-head{ padding-top:22px; }
    .drawer-head::before{ content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
      width:40px; height:4px; border-radius:2px; background:var(--border-strong); }
    .drawer{ position:fixed; }
    .drawer-head{ position:relative; }
  }
  /* ═══════════════════════════════════════════════
     TEMA: YOĞUN TERMİNAL — seçenek J
     Parıltı/cam/gradyan yok. Mat, keskin, yoğun.
     ═══════════════════════════════════════════════ */
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#11161d; --row-hover:#1c2128; --row-alt:transparent;
    --border:#1f242c; --border-strong:#30363d; --ink:#e6edf3; --muted:#8b949e; --faint:#6e7681;
    --accent:#d9a441; --accent-dim:#8a6a2b;
    --pos:#3fb950; --pos-bg:rgba(63,185,80,.14);
    --neg:#f85149; --neg-bg:rgba(248,81,73,.14);
    --etf:#58a6ff; --etf-bg:rgba(88,166,255,.14);
    --fund:#bc8cff; --fund-bg:rgba(188,140,255,.14);
    --live:#3fb950; --shadow:none; --r:8px;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f6f8fa; --panel-2:#f0f3f6; --row-hover:#f0f3f6; --row-alt:transparent;
    --border:#d8dee4; --border-strong:#afb8c1; --ink:#1f2328; --muted:#59636e; --faint:#818b98;
    --accent:#9a6700; --accent-dim:#bf8700;
    --pos:#1a7f37; --pos-bg:rgba(26,127,55,.10); --neg:#cf222e; --neg-bg:rgba(207,34,46,.10);
    --shadow:none;
  }
  body{ background:var(--bg); background-image:none; }
  /* Yüzeyler: düz, gölgesiz, keskin */
  header,.tabbar,.pp,.an-search,.an-header,.note-bar,.toolbar,.ticker{
    background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none;
    border-bottom:1px solid var(--border); box-shadow:none;
  }
  .tabbar{ background:var(--panel); border-top:1px solid var(--border-strong); border-bottom:none; }
  .note-bar,.toolbar{ border-bottom:none; }
  .ticker{ border-top:1px solid var(--border); }
  .kpis,.pp-cat,.pp-periods,.dist,.evt,.kv,.stat-box,.an-item,.cs-top,.cs-row,.fa-scroll,
  .fa-prof,.modal-card,.drawer,.sig-list,.news-list,.cal,.kv-grid,.price-banner,.an-results,
  .swing-box,.overall,.interp,.evt-row,.fund-note,.mcard,.val-row,.sc-dim,.d-chart,.fut,.stale{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--r); box-shadow:none;
  }
  .drawer,.modal-card{ background:var(--bg); border-radius:0; }
  .overlay{ background:rgba(0,0,0,.62); -webkit-backdrop-filter:none; backdrop-filter:none; }
  .cs-top{ background:var(--panel); }
  .btn,#search,#anQuery,.field input,.field select,.pos-input,.fchip,.typesel,.langsel,
  .pp-ccy,.dist-tabs,.fa-tabs button,.range-sel,.fa-per{
    background:var(--panel); border:1px solid var(--border-strong); border-radius:6px; box-shadow:none;
  }
  .btn.primary,.btn.on,.fchip.on,.typesel button.on,.langsel button.on,.pp-ccy button.on,
  .dist-tabs button.on,.fa-tabs button.on,.range-sel button.on,.fa-per.on{
    background:var(--accent); color:#141007; border-color:var(--accent); box-shadow:none;
  }
  .langsel button,.typesel button,.pp-ccy button,.dist-tabs button,.range-sel button{ background:transparent; }
  .brand .mark{ box-shadow:none; border-radius:2px; }
  .pos-line{ background:var(--panel); border:1px solid var(--accent-dim); border-radius:6px; }
  .disclaimer{ background:var(--panel); border:1px solid var(--border); border-radius:6px; }
  .cs-grade.g-A{ background:var(--pos-bg); color:var(--pos); box-shadow:none; }
  .mb-col span,.d-col span{ background:var(--accent-dim); border-radius:2px 2px 0 0; }
  .mb-col span.now,.d-col span{ background:var(--accent); }
  .mb-col span.neg{ background:var(--neg); }
  .cs-meter span,.sc-bar span{ background:var(--accent); }
  .sc-bar .pos{ background:var(--pos); } .sc-bar .mid{ background:var(--accent); } .sc-bar .low{ background:var(--neg); }
  .fut{ background:var(--panel); border-color:var(--accent-dim); }
  .fut-row{ background:var(--bg); }
  /* Tablo: yoğun ve keskin */
  thead th{ background:var(--bg); border-bottom:1px solid var(--border-strong); }
  tbody td{ border-bottom:1px solid var(--border); }
  td.name-cell{ background:var(--bg); border-right:1px solid var(--border); }
  tbody tr:hover td,tbody tr:hover td.name-cell{ background:var(--row-hover); }
  tr.group-row td{ background:var(--panel); border-radius:0; }

  /* ---- MOBİL: kart değil, YOĞUN TABLO ---- */
  @media (max-width:600px){
    body{ font-size:12.5px; }
    table{ display:table; min-width:0; width:100%; }
    thead{ display:table-header-group; }
    tbody{ display:table-row-group; padding:0; }
    tbody tr{ display:table-row; background:transparent; border:none;
      border-radius:0; margin:0; padding:0; box-shadow:none; }
    tbody tr:active{ transform:none; }
    tbody td{ display:table-cell; border-bottom:1px solid var(--border);
      padding:7px 4px; font-size:.7rem; text-align:right; background:transparent !important; }
    thead th{ padding:6px 4px; font-size:.5rem; }
    /* Görünen sütunlar: İsim · Fiyat · Gün · RSI · F/K */
    thead th:nth-child(4), tbody td:nth-child(4),    /* gün aralığı */
    thead th:nth-child(6), tbody td:nth-child(6),    /* bilanço */
    thead th:nth-child(8), tbody td:nth-child(8),    /* SNA */
    thead th:nth-child(9), tbody td:nth-child(9),    /* borç */
    thead th:nth-child(10), tbody td:nth-child(10),  /* temettü */
    thead th:nth-child(11), tbody td:nth-child(11),  /* sektör */
    thead th:nth-child(12), tbody td:nth-child(12){ display:none; }
    td.name-cell{ display:table-cell; position:static; text-align:left;
      max-width:112px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      border-right:none; padding-left:2px; }
    .nm{ font-size:.74rem; font-weight:600; }
    .nm-sub{ font-size:.53rem; gap:3px; margin-top:0; }
    .nm-sub .badge, .nm-sub .tbadge{ display:none; }
    tr.group-row td{ display:table-cell !important; }
    .chg{ padding:1px 5px; min-width:0; font-size:.68rem; }
    .drawer{ border-radius:0; }
  }
  /* ---- Karne / Değerleme / Temettü ---- */
  .sc-list{display:flex;flex-direction:column;gap:11px}
  .sc-dim{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:14px;padding:11px 13px}
  .sc-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;font-weight:600}
  .sc-h b{font-family:var(--font-mono);color:var(--accent)}
  .sc-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
  .sc-bar span{display:block;height:100%;border-radius:4px}
  .sc-bar .pos{background:linear-gradient(90deg,#5ee7a8,#37d385)}
  .sc-bar .mid{background:linear-gradient(90deg,#f3cd85,#e2b45f)}
  .sc-bar .low{background:linear-gradient(90deg,#ff9a8f,#ff7a6e)}
  .sc-notes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .sc-n{font-size:.63rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .sc-n.pos{border-color:rgba(94,231,168,.4);color:var(--pos)}
  .sc-n.neg{border-color:rgba(255,122,110,.4);color:var(--neg)}
  .val-row{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .v-h{display:flex;justify-content:space-between;align-items:baseline}
  .v-n{font-size:.8rem;font-weight:600}
  .v-c{font-family:var(--font-mono);font-size:1.05rem;font-weight:700;color:var(--ink)}
  .v-track{position:relative;height:7px;border-radius:4px;margin:11px 0 7px;
    background:linear-gradient(90deg,rgba(94,231,168,.35),rgba(226,180,95,.3),rgba(255,122,110,.35))}
  .v-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--accent);
    border:2px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--accent-dim)}
  .v-avg{position:absolute;top:-3px;width:2px;height:13px;background:var(--muted);transform:translateX(-50%);opacity:.7}
  .v-f{display:flex;justify-content:space-between;font-size:.63rem;color:var(--faint);font-family:var(--font-mono)}
  .v-f .pos{color:var(--pos)} .v-f .neg{color:var(--neg)}
  .d-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .d-b{font-size:.68rem;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid var(--border)}
  .d-b.pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(94,231,168,.35)}
  .d-b.neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(255,122,110,.35)}
  .d-chart{display:flex;align-items:flex-end;gap:5px;height:110px;background:rgba(255,255,255,.05);
    border:1px solid var(--border);border-radius:14px;padding:12px 12px 6px}
  .d-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .d-col span{width:100%;max-width:26px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--accent),rgba(226,180,95,.35))}
  .d-col em{font-size:.55rem;color:var(--faint);font-style:normal;margin-top:5px;font-family:var(--font-mono)}
  /* ---- Mali tablo kartları ---- */
  .fa-per-row{display:flex;gap:6px;margin-bottom:11px}
  .fa-per{padding:6px 13px;border-radius:11px;border:1px solid var(--border);
    background:rgba(255,255,255,.06);color:var(--muted);font-size:.7rem;font-weight:700}
  .fa-per.on{background:linear-gradient(135deg,#f3cd85,#dfae56);color:#191307;border-color:transparent}
  .mcard{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;
    padding:13px 15px;margin-bottom:10px}
  .mc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .mc-l{font-size:.78rem;font-weight:600;color:var(--muted)}
  .mc-v{font-family:var(--font-mono);font-size:1.25rem;font-weight:700;color:var(--ink)}
  .mc-v.neg{color:var(--neg)}
  .mc-bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin:11px 0 8px}
  .mb-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .mb-col span{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:rgba(226,180,95,.35)}
  .mb-col span.now{background:linear-gradient(180deg,var(--accent),rgba(226,180,95,.5))}
  .mb-col span.neg{background:rgba(255,122,110,.4)}
  .mb-col span.neg.now{background:linear-gradient(180deg,var(--neg),rgba(255,122,110,.5))}
  .mb-col em{font-size:.53rem;color:var(--faint);font-style:normal;margin-top:5px;font-family:var(--font-mono)}
  .mc-chips{display:flex;gap:6px;flex-wrap:wrap}
  .mc-chip{font-size:.64rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
  .mc-chip.pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(94,231,168,.35)}
  .mc-chip.neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(255,122,110,.35)}
  .mg-row{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
  .mg{flex:1;min-width:96px;background:rgba(255,255,255,.05);border:1px solid var(--border);
    border-radius:12px;padding:9px 11px;text-align:center}
  .mg span{display:block;font-size:.58rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .mg b{display:block;font-family:var(--font-mono);font-size:.95rem;margin-top:3px}
  .fut{background:linear-gradient(180deg,rgba(226,180,95,.10),rgba(255,255,255,.04));
    border:1px solid var(--accent-dim);border-radius:16px;padding:13px 15px;margin:4px 0 10px}
  .fut-h{font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:9px}
  .fut-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:11px;overflow:hidden}
  .fut-row{display:flex;align-items:center;gap:8px;background:rgba(12,16,26,.5);padding:8px 11px;font-size:.72rem}
  .fr-p{flex:1;min-width:0;color:var(--ink);font-weight:600}
  .fr-v{font-family:var(--font-mono);color:var(--muted)}
  .fr-e{font-family:var(--font-mono);color:var(--faint);font-size:.66rem;min-width:62px;text-align:right}
  .fr-g{font-family:var(--font-mono);font-weight:700;min-width:46px;text-align:right}
  .stale{background:linear-gradient(180deg,rgba(226,180,95,.14),rgba(255,255,255,.04));
    border:1px solid var(--accent-dim);border-radius:14px;padding:11px 13px;margin-bottom:11px}
  .stale b{color:var(--accent)}
  .st-b{font-size:.72rem;color:var(--muted);line-height:1.55;margin-top:4px}
  .st-e{font-size:.76rem;font-family:var(--font-mono);margin-top:7px;color:var(--ink)}
  .asof{font-size:.66rem;color:var(--faint);margin-bottom:10px}
  .asof b{color:var(--muted);font-family:var(--font-mono)}
  /* Panel açıkken arka sayfa kaymasın; kaydırma panelin içinde kalsın */
  body.no-scroll{ overflow:hidden; }
  .drawer-body{ -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .drawer{ overscroll-behavior:contain; }
  .modal{ overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  @media (max-width:600px){ .drawer-body{ max-height:calc(93vh - 76px); } }
  /* ---- MOBİL: üst bölümü sıkıştır (liste hemen görünsün) ---- */

  /* ═══════════════════════════════════════════════
     GÖRÜNÜM 2: CAM  (data-skin="glass" ile açılır)

  :root[data-skin="glass"]{
    --bg:#080b12; --panel:rgba(255,255,255,.065); --panel-2:rgba(255,255,255,.045);
    --row-hover:rgba(255,255,255,.10); --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --ink:#eaf0f8; --muted:#9fb0c9; --faint:#6b7d96;
    --accent:#e2b45f; --accent-dim:rgba(226,180,95,.55);
    --pos:#5ee7a8; --pos-bg:rgba(94,231,168,.14);
    --neg:#ff7a6e; --neg-bg:rgba(255,122,110,.14);
    --etf:#7bb7f0; --etf-bg:rgba(123,183,240,.16);
    --fund:#c49bf0; --fund-bg:rgba(196,155,240,.16);
    --live:#5ee7a8; --shadow:0 10px 34px rgba(0,0,0,.42); --r:18px;
  }
  :root[data-skin="glass"] body{
    background:
      radial-gradient(120% 85% at 12% -5%, #2e3f73 0%, rgba(46,63,115,0) 58%),
      radial-gradient(95% 70% at 95% 8%, #1d3350 0%, rgba(29,51,80,0) 62%),

  }

  :root[data-skin="glass"] .tabbar,
  :root[data-skin="glass"] .pp,
  :root[data-skin="glass"] .an-search,

  :root[data-skin="glass"] .tabbar{ background:rgba(12,16,26,.72); border-top:1px solid var(--border); border-bottom:none; }
  :root[data-skin="glass"] .note-bar,
  :root[data-skin="glass"] .toolbar{ background:transparent; border-bottom:none; }
  :root[data-skin="glass"] .ticker{ background:transparent; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  :root[data-skin="glass"] .kpis,
  :root[data-skin="glass"] .pp-cat,
  :root[data-skin="glass"] .pp-periods,
  :root[data-skin="glass"] .dist,

  :root[data-skin="glass"] .fa-prof,

  /* ═══ YAN MENÜ (sidebar) ═══ */
  .shell,.screen{ padding-bottom:24px; }
  .menu-btn{ background:var(--panel); border:1px solid var(--border-strong); border-radius:8px;
    color:var(--ink); font-size:1rem; width:34px; height:32px; flex:none; line-height:1; }
  .menu-btn:hover{ border-color:var(--accent-dim); }

    justify-content:center; flex:0 0 auto; }

  .nav-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none;
    transition:opacity .18s; z-index:60; }
  .nav-overlay.show{ opacity:1; pointer-events:auto; }
  .sidenav{ position:fixed; top:0; left:0; height:100%; width:258px; max-width:86vw; z-index:61;
    background:var(--bg); border-right:1px solid var(--border-strong);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    transform:translateX(-100%); transition:transform .2s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain; }
  .sidenav.show{ transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .sidenav,.nav-overlay{ transition:none; } }
  .sn-head{ display:flex; align-items:center; gap:9px; padding:15px 14px 12px; border-bottom:1px solid var(--border); padding-top:max(15px, env(safe-area-inset-top)); }
  .sn-head .mark{ width:9px; height:9px; border-radius:2px; background:var(--accent); transform:rotate(45deg); }

  /* İşlem ekranı */
  .tx-sum{ padding:11px 22px 4px; }

  .txs span{ display:block; font-size:.52rem; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); }
  .txs b{ display:block; font-family:var(--font-mono); font-size:.85rem; margin-top:2px; }
  .tx-body{ flex:1; overflow-y:auto; padding:6px 22px 26px; }
  .tx-list{ display:flex; flex-direction:column; gap:6px; }

    border:1px solid var(--border); border-radius:9px; padding:9px 11px; }

  .tx-item:hover{ border-color:var(--accent-dim); }
  .tp-l,.tx-n{ flex:1; min-width:0; }

  .tp-r,.tx-v{ text-align:right; flex:none; }
  .tp-r b,.tx-v b{ display:block; font-family:var(--font-mono); font-size:.8rem; }
  .tp-r s,.tx-v s{ display:block; font-size:.63rem; text-decoration:none; margin-top:2px; color:var(--faint); }
  .tx-k{ font-size:.55rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:2px 7px; border-radius:5px; flex:none; background:var(--panel-2); color:var(--muted); }
  .tx-k.buy{ background:var(--pos-bg); color:var(--pos); }
  .tx-k.sell{ background:var(--neg-bg); color:var(--neg); }
  .tx-k.opt{ background:rgba(188,140,255,.16); color:var(--fund); }
  .tx-k.cash{ background:rgba(226,180,95,.16); color:var(--accent); }
  .tx-del{ background:none; border:none; color:var(--faint); font-size:.75rem; padding:2px 4px; flex:none; }

  .tx-kinds{ display:flex; gap:6px; margin-bottom:13px; flex-wrap:wrap; }
  .tk{ padding:7px 13px; border-radius:8px; border:1px solid var(--border-strong);

  .ss-label.picked{ color:var(--pos); }
  .opt-b{ font-size:.55rem; padding:1px 6px; border-radius:4px; font-weight:700; }
  .opt-b.call{ background:var(--pos-bg); color:var(--pos); }
  .opt-b.put{ background:var(--neg-bg); color:var(--neg); }

  /* Rapor ekranı */
  body.scr-report .shell{ display:none; }
  body.scr-report #screenReport{ display:flex; }
  .rep-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px;

  @media (max-width:600px){

  function drawSpark(id,arr){ var cv=document.getElementById(id); if(!cv||!arr||arr.length<2) return; var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height,pad=4; var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rng=(mx-mn)||1; var up=arr[arr.length-1]>=arr[0]; var col=getCss(up?'--pos':'--neg'); ctx.clearRect(0,0,W,H); ctx.lineWidth=1.5; ctx.strokeStyle=col; ctx.beginPath(); arr.forEach(function(v,i){ var x=pad+i/(arr.length-1)*(W-2*pad); var y=H-pad-((v-mn)/rng)*(H-2*pad); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke(); var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,col+'44'); g.addColorStop(1,col+'00'); ctx.lineTo(W-pad,H-pad); ctx.lineTo(pad,H-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill(); }

  // Portfoy penceresi grafigi — temiz duzen: fiyat ekseni sagda, cerceve yok, ince ortalamalar
  function drawBigChart(D){
    var el=document.getElementById('bigChart'); if(!el) return;
    var b=D&&D.bars, S=(D&&D.series)||{};
    if(!b||b.length<3){ el.innerHTML='<div class="fa-note">'+t('trNoData')+'</div>'; return; }
    var W=400, L=6, R=52, TOP=10, PH=232, H=TOP+PH+30;
    var iw=W-L-R, n=b.length, step=iw/n;
    var bw=Math.max(1.8, Math.min(13, step*0.68));
    var his=[], los=[];
    b.forEach(function(x){ his.push(x.h); los.push(x.l); });
    var pHi=Math.max.apply(null,his), pLo=Math.min.apply(null,los), pRg=(pHi-pLo)||1;
    var cap=pRg*0.75, hi=pHi, lo=pLo;
    [S.ma50,S.ma200].forEach(function(a){ if(!a) return; a.forEach(function(v){ if(v==null) return;
      if(v>hi) hi=Math.min(v, pHi+cap); if(v<lo) lo=Math.max(v, pLo-cap); }); });
    var rg=(hi-lo)||1; hi+=rg*0.04; lo-=rg*0.04; rg=hi-lo;
    function X(i){ return L+step*i+step/2; }
    function Y(v){ return TOP+PH-((v-lo)/rg)*PH; }
    function fv(v){ var a=Math.abs(v);
      return a>=1000? Math.round(v).toLocaleString('sv-SE') : (a>=100? v.toFixed(1): v.toFixed(2)); }
    var g=[];
    g.push('<clipPath id="pcl"><rect x="'+L+'" y="'+TOP+'" width="'+iw+'" height="'+PH+'"/></clipPath>');
    // ince yatay izgara + SAGDA fiyat ekseni
    for(var gi=0;gi<=4;gi++){ var vv=lo+rg*gi/4, yy=Y(vv);
      g.push('<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" class="cg"/>');
      g.push('<text x="'+(W-R+6)+'" y="'+(yy+3.4).toFixed(1)+'" class="cax">'+fv(vv)+'</text>'); }

    for(var ti=0;ti<n;ti++){ var dt=new Date(b[ti].t*1000);

      if(!seen[key]){ seen[key]=1; marks.push({i:ti,d:dt}); } }
    var every=Math.max(1,Math.ceil(marks.length/4));
    var MON=(lang==='tr')?['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara']
           :(lang==='sv')?['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec']
           :['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    marks.forEach(function(m,mi){ if(mi%every) return; if(m.i<2) return;
      if(X(m.i) > W-R-46) return;   // sag kenara tasan etiketi atla
      g.push('<line x1="'+X(m.i).toFixed(1)+'" y1="'+TOP+'" x2="'+X(m.i).toFixed(1)+'" y2="'+(TOP+PH)+'" class="vsep"/>');
      g.push('<text x="'+(X(m.i)+3).toFixed(1)+'" y="'+(TOP+PH+13)+'" class="cax dt">'+
        MON[m.d.getMonth()]+' '+m.d.getFullYear()+'</text>'); });
    // mumlar
    b.forEach(function(x,i){
      var up=x.c>=x.o, cls=up?'cu':'cd', cx=X(i);
      g.push('<line x1="'+cx.toFixed(1)+'" y1="'+Y(x.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+Y(x.l).toFixed(1)+'" class="wick '+cls+'"/>');
      var y1=Y(Math.max(x.o,x.c)), y2=Y(Math.min(x.o,x.c));
      g.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1.2,(y2-y1)).toFixed(1)+'" class="body '+cls+'"/>');
    });
    function line(arr,cls){ if(!arr) return '';
      var pp='',st=false;
      for(var i=0;i<arr.length;i++){ var v=arr[i]; if(v==null){st=false;continue;}
        pp+=(st?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; st=true; }
      return pp?'<path d="'+pp+'" class="'+cls+'"/>':''; }
    g.push('<g clip-path="url(#pcl)">'+line(S.ma200,'ma ma200')+line(S.ma50,'ma ma50')+'</g>');
    // son fiyat: kesikli cizgi + sagda beyaz etiket
    var lp=b[b.length-1].c, lpy=Y(lp);
    g.push('<line x1="'+L+'" y1="'+lpy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+lpy.toFixed(1)+'" class="lastp"/>');
    g.push('<rect x="'+(W-R+2)+'" y="'+(lpy-8).toFixed(1)+'" width="'+(R-4)+'" height="16" rx="2.5" class="lastbg"/>');
    g.push('<text x="'+(W-R+2+(R-4)/2)+'" y="'+(lpy+4).toFixed(1)+'" class="lastt" text-anchor="middle">'+fv(lp)+'</text>');
    // donem getirileri
    var RT=D.returns||{};
    var retRows=[['m1','r_1mo'],['m3','r_3mo'],['m6','r_6mo'],['y1','r_1y']]
      .filter(function(x){ return RT[x[0]]!=null; })

        '<div class="tc '+(c>=0?'pos':'neg')+'">'+pctTxt(c,2)+'</div></div>';
    }

      return {n:t(s[1]), sym:s[0], c:x.pct};
    }).filter(Boolean).sort(function(a,b){ return b.c-a.c; });
    var maxAbs=Math.max.apply(null,secs.map(function(s){return Math.abs(s.c)||0;}))||1;
    var secHtml=secs.map(function(s){
      var w=Math.abs(s.c)/maxAbs*100;

        '<span class="rc '+(s.c>=0?'pos':'neg')+'">'+pctTxt(s.c,2)+'</span></div>'; }).join('');

    var vix=(m['^VIX']||{}).price, spx=(m['^GSPC']||{}).pct, tnx=(m['^TNX']||{}).price;
    var risk=[];
    if(vix!=null){ risk.push(vix<16?{d:'pos',k:'macCalm',v:vix.toFixed(1)}:vix>25?{d:'neg',k:'macFear',v:vix.toFixed(1)}:{d:'neu',k:'macNormal',v:vix.toFixed(1)}); }
    if(spx!=null){ risk.push(spx>=0?{d:'pos',k:'macSpxUp',v:spx.toFixed(2)}:{d:'neg',k:'macSpxDn',v:Math.abs(spx).toFixed(2)}); }
    if(tnx!=null){ risk.push(tnx>4.5?{d:'neg',k:'macRateHigh',v:tnx.toFixed(2)}:{d:'neu',k:'macRateOk',v:tnx.toFixed(2)}); }
    return '<div class="rep-card"><div class="rep-h">'+t('macTitle')+'</div><div class="rep-grid">'+macro+'</div></div>'+
      (risk.length?('<div class="rep-card"><div class="rep-h">'+t('macRisk')+'</div><div class="sig-list">'+
        risk.map(function(r){ return '<div class="sig-item"><span class="sig-dot '+r.d+'"></span><span>'+esc(t(r.k,{v:r.v}))+'</span></div>'; }).join('')+
        '</div></div>'):'')+
      (secHtml?('<div class="rep-card"><div class="rep-h">'+t('macSectors')+'</div>'+secHtml+
        '<div class="fa-note">'+t('macSecNote')+'</div></div>'):'')+
      '<div class="disclaimer">'+t('disclaimer')+'</div>';
  }
  function buildDaily(){

              delta:liveValSEK(c)*(c.live.pct/100)/(1+c.live.pct/100)}; });
    var tot=0,day=0;
    withVal.forEach(function(x){ tot+=x.val; day+=x.delta; });
    var up=withVal.filter(function(x){return x.pct>0;}).length;
    var dn=withVal.filter(function(x){return x.pct<0;}).length;
    var byDelta=withVal.slice().sort(function(a,b){ return b.delta-a.delta; });
    var win=byDelta.slice(0,5), los=byDelta.slice(-5).reverse();

      return '<div class="rep-line"><span class="rn">'+esc(x.name)+'</span>'+

        '<span class="rc '+(x.pct>=0?'pos':'neg')+'">'+pctTxt(x.pct,2)+'</span></div>'; }).join(''); }
    var dpct=(tot-day)>0?(day/(tot-day)*100):0;

      swings.map(function(s){ return '<div class="rep-line"><span class="rn">'+esc(s.n)+'</span>'+
        '<span class="rc accent">'+s.s+'/'+s.m+'</span></div>'; }).join('')+'</div>'):'';
    return '<div class="rep-card"><div class="rep-h">'+t('dayTitle')+' · '+new Date().toLocaleDateString(lang==='tr'?'tr-TR':lang==='sv'?'sv-SE':'en-US',{day:'numeric',month:'long'})+'</div>'+
      '<div class="rep-big '+(day>=0?'pos':'neg')+'">'+fmtMoney(day)+'</div>'+
      '<div class="rep-sub">'+pctTxt(dpct,2)+' · '+t('dayTotal')+' '+fmtMoney(tot)+'</div>'+
      '<div class="rep-grid" style="margin-top:11px">'+
        '<div class="rep-tile"><div class="tl">'+t('kUp')+'</div><div class="tv pos">'+up+'</div></div>'+
        '<div class="rep-tile"><div class="tl">'+t('kDown')+'</div><div class="tv neg">'+dn+'</div></div>'+
        '<div class="rep-tile"><div class="tl">'+t('dayBreadth')+'</div><div class="tv">'+(up+dn?Math.round(up/(up+dn)*100):0)+'%</div></div>'+
      '</div></div>'+
      buildOutlook(up,dn)+
      '<div class="rep-card"><div class="rep-h">'+t('dayWinners')+'</div>'+rows(win)+'</div>'+
      '<div class="rep-card"><div class="rep-h">'+t('dayLosers')+'</div>'+rows(los)+'</div>'+
      evHtml + swHtml +
      '<div class="disclaimer">'+t('disclaimer')+'</div>';
  }

  // ---- SVG grafik: mum + MA + hacim + RSI + MACD ----
  function taChart(D){
    var b=D.bars, S=D.series||{}; if(!b||b.length<5) return '';
    // viewBox'i ekran genisligine yakin tut -> yazilar kuculmesin
    var W=400, L=42, R=46, TOP=14;
    var PH=186, RH=92, MH=64, GAP=22;
    var iw=W-L-R, n=b.length, step=iw/n;
    var bw=Math.max(2.2, Math.min(15, step*0.72));
    var his=[], los=[];
    b.forEach(function(x){ his.push(x.h); los.push(x.l); });
    var pHi=Math.max.apply(null,his), pLo=Math.min.apply(null,los), pRg=(pHi-pLo)||1;
    var cap=pRg*0.75, hi=pHi, lo=pLo;
    [S.ma20,S.ma50,S.ma200].forEach(function(a){ if(!a) return; a.forEach(function(v){ if(v==null) return;
      if(v>hi) hi=Math.min(v, pHi+cap); if(v<lo) lo=Math.max(v, pLo-cap); }); });
    var rg=(hi-lo)||1; hi+=rg*0.05; lo-=rg*0.05; rg=hi-lo;
    function X(i){ return L+step*i+step/2; }
    function Y(v){ return TOP+PH-((v-lo)/rg)*PH; }
    function fv(v){ var a=Math.abs(v);
      return a>=1000? Math.round(v).toLocaleString('sv-SE') : (a>=100? v.toFixed(1): v.toFixed(2)); }
    var g=[];
    // fiyat paneli zemin + izgara
    g.push('<clipPath id="tacl"><rect x="'+L+'" y="'+TOP+'" width="'+iw+'" height="'+PH+'"/></clipPath>');
    g.push('<rect x="'+L+'" y="'+TOP+'" width="'+iw+'" height="'+PH+'" class="pane"/>');
    for(var gi=0;gi<=4;gi++){ var vv=lo+rg*gi/4, yy=Y(vv);
      g.push('<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" class="cg"/>');
      g.push('<text x="'+(L-6)+'" y="'+(yy+3.5).toFixed(1)+'" class="cax" text-anchor="end">'+fv(vv)+'</text>'); }
    // tarih etiketleri
    var lbl=Math.max(1,Math.floor(n/4));
    for(var ti=0;ti<n;ti+=lbl){
      var dt=new Date(b[ti].t*1000);
      var txt=(D.interval==='1mo')? (dt.getMonth()+1)+'/'+String(dt.getFullYear()).slice(2)
             : dt.getDate()+'/'+(dt.getMonth()+1);
      g.push('<text x="'+X(ti).toFixed(1)+'" y="'+(TOP+PH+11)+'" class="cax" text-anchor="middle">'+txt+'</text>'); }
    // mumlar
    b.forEach(function(x,i){
      var up=x.c>=x.o, cls=up?'cu':'cd', cx=X(i);
      g.push('<line x1="'+cx.toFixed(1)+'" y1="'+Y(x.h).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+Y(x.l).toFixed(1)+'" class="wick '+cls+'"/>');
      var y1=Y(Math.max(x.o,x.c)), y2=Y(Math.min(x.o,x.c));
      g.push('<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1.4,(y2-y1)).toFixed(1)+'" class="body '+cls+'"/>');
    });
    function line(arr,cls){ if(!arr) return '';
      var p='',st=false;
      for(var i=0;i<arr.length;i++){ var v=arr[i]; if(v==null){st=false;continue;}
        p+=(st?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; st=true; }
      return p?'<path d="'+p+'" class="'+cls+'"/>':''; }
    g.push('<g clip-path="url(#tacl)">'+line(S.ma200,'ma ma200')+line(S.ma50,'ma ma50')+line(S.ma20,'ma ma20')+'</g>');
    // son fiyat
    var lp=b[b.length-1].c, lpy=Y(lp);
    g.push('<line x1="'+L+'" y1="'+lpy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+lpy.toFixed(1)+'" class="lastp"/>');
    g.push('<rect x="'+(W-R+2)+'" y="'+(lpy-7.5).toFixed(1)+'" width="'+(R-4)+'" height="15" rx="2.5" class="lastbg"/>');
    g.push('<text x="'+(W-R+2+(R-4)/2)+'" y="'+(lpy+3.8).toFixed(1)+'" class="lastt" text-anchor="middle">'+fv(lp)+'</text>');

    // ---- RSI (TradingView duzeni) ----
    var ry=TOP+PH+GAP+8;
    function RY(v){ return ry+RH-(v/100)*RH; }
    g.push('<rect x="'+L+'" y="'+ry+'" width="'+iw+'" height="'+RH+'" class="pane"/>');
    // asiri alim / asiri satim bolgeleri + orta bant
    g.push('<rect x="'+L+'" y="'+ry+'" width="'+iw+'" height="'+(RY(70)-ry).toFixed(1)+'" class="rsiHot"/>');
    g.push('<rect x="'+L+'" y="'+RY(30).toFixed(1)+'" width="'+iw+'" height="'+(ry+RH-RY(30)).toFixed(1)+'" class="rsiCold"/>');
    g.push('<rect x="'+L+'" y="'+RY(70).toFixed(1)+'" width="'+iw+'" height="'+(RY(30)-RY(70)).toFixed(1)+'" class="rsiBand"/>');
    [[70,'lv'],[30,'lv'],[50,'mid']].forEach(function(x){
      g.push('<line x1="'+L+'" y1="'+RY(x[0]).toFixed(1)+'" x2="'+(W-R)+'" y2="'+RY(x[0]).toFixed(1)+'" class="cg '+x[1]+'"/>'); });
    [0,30,50,70,100].forEach(function(x){
      g.push('<text x="'+(L-6)+'" y="'+(RY(x)+3.2).toFixed(1)+'" class="cax'+(x===30||x===70?' key':'')+'" text-anchor="end">'+x+'</text>'); });
    g.push('<text x="'+L+'" y="'+(ry-4)+'" class="cpl">RSI 14 <tspan class="cpv">'+
      (D.rsi!=null?D.rsi.toFixed(2):'—')+'</tspan></text>');
    if(S.rsi){
      var rp='',rs=false,lastR=null;
      for(var i3=0;i3<S.rsi.length;i3++){ var rv=S.rsi[i3]; if(rv==null){rs=false;continue;}
        rp+=(rs?'L':'M')+X(i3).toFixed(1)+' '+RY(rv).toFixed(1)+' '; rs=true; lastR=rv; }
      // RSI'nin 14 periyotluk ortalamasi (TradingView'de MA cizgisi)
      var rma=[], win=[];
      for(var j=0;j<S.rsi.length;j++){ var q=S.rsi[j];
        if(q==null){ rma.push(null); continue; }
        win.push(q); if(win.length>14) win.shift();
        rma.push(win.length===14 ? win.reduce(function(a,c){return a+c;},0)/14 : null); }
      var mp='',ms=false;
      for(var j2=0;j2<rma.length;j2++){ var mv2=rma[j2]; if(mv2==null){ms=false;continue;}
        mp+=(ms?'L':'M')+X(j2).toFixed(1)+' '+RY(mv2).toFixed(1)+' '; ms=true; }
      if(mp) g.push('<path d="'+mp+'" class="ma rsima"/>');
      if(rp) g.push('<path d="'+rp+'" class="ma rsil"/>');
      if(lastR!=null){
        g.push('<circle cx="'+X(S.rsi.length-1).toFixed(1)+'" cy="'+RY(lastR).toFixed(1)+'" r="2" class="rsidot"/>');
        g.push('<rect x="'+(W-R+2)+'" y="'+(RY(lastR)-7).toFixed(1)+'" width="'+(R-4)+'" height="14" rx="2.5" class="rsibg"/>');
        g.push('<text x="'+(W-R+2+(R-4)/2)+'" y="'+(RY(lastR)+3.6).toFixed(1)+'" class="rsit" text-anchor="middle">'+lastR.toFixed(1)+'</text>'); }
    }

    // ---- MACD ----
    var my=ry+RH+GAP, H=my+MH+8;
    var mvals=[]; (S.macd||[]).forEach(function(v){ if(v!=null) mvals.push(Math.abs(v)); });
    (S.signal||[]).forEach(function(v){ if(v!=null) mvals.push(Math.abs(v)); });
    if(mvals.length){
      var mx=Math.max.apply(null,mvals)||1;
      var MY=function(v){ return my+MH/2-(v/mx)*(MH/2*0.88); };
      g.push('<rect x="'+L+'" y="'+my+'" width="'+iw+'" height="'+MH+'" class="pane"/>');
      g.push('<text x="'+L+'" y="'+(my-4)+'" class="cpl">MACD (12,26,9)</text>');
      g.push('<line x1="'+L+'" y1="'+MY(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+MY(0).toFixed(1)+'" class="cg mid"/>');
      for(var i4=0;i4<(S.macd||[]).length;i4++){ var a4=S.macd[i4], b4=S.signal?S.signal[i4]:null;
        if(a4==null||b4==null) continue; var h4=a4-b4;
        g.push('<rect x="'+(X(i4)-bw/2).toFixed(1)+'" y="'+Math.min(MY(0),MY(h4)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.6,Math.abs(MY(h4)-MY(0))).toFixed(1)+'" class="vb '+(h4>=0?'cu':'cd')+'"/>'); }
      var ml=function(arr,cls){ var p='',s2=false;
        for(var i5=0;i5<arr.length;i5++){ var v5=arr[i5]; if(v5==null){s2=false;continue;}
          p+=(s2?'L':'M')+X(i5).toFixed(1)+' '+MY(v5).toFixed(1)+' '; s2=true; }
        return p?'<path d="'+p+'" class="'+cls+'"/>':''; };
      g.push(ml(S.macd||[],'ma macdl')); g.push(ml(S.signal||[],'ma macds'));
    } else { H=my+8; }
    return '<div class="ta-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g.join('')+'</svg>'+
      '<div class="ta-leg"><span class="lg ma20">MA20</span><span class="lg ma50">MA50</span>'+
      '<span class="lg ma200">MA200</span><span class="lg gr">'+t('taUpBar')+'</span><span class="lg rd">'+t('taDnBar')+'</span>'+
      '<span class="lg rsl">'+t('taLegRsi')+'</span><span class="lg rsm">'+t('taLegRsiMa')+'</span></div>'+
      (D.partialLast?'<div class="fa-note">'+t('taPartial')+'</div>':'')+'</div>';
  }
  function buildTA(){
    if(!TA.sym) return '<div class="rep-card"><div class="fa-note">'+t('taPick')+'</div></div>';
    if(TA.loading) return '<div class="rep-card"><div class="fa-load">'+t('anLoading')+'</div></div>';
    var D=TA.data;
    if(!D||!D.ok) return '<div class="rep-card"><div class="fa-note">'+t('trNoData')+'</div></div>';
    var cur=D.currency||'';
    function num(v,dc){ return v==null?'—':Number(v).toFixed(dc==null?2:dc); }
    var SUM={strong_up:['taSumStrongUp','pos'],up:['taSumUp','pos'],neutral:['taSumNeutral','neu'],
             down:['taSumDown','neg'],strong_down:['taSumStrongDown','neg']}[D.summary]||['taSumNeutral','neu'];
    var ivs=[['1d','taIvD'],['1wk','taIvW'],['1mo','taIvM']].map(function(x){
      return '<button class="rg'+(TA.iv===x[0]?' on':'')+'" data-taiv="'+x[0]+'">'+t(x[1])+'</button>'; }).join('');
    var ranges=(TA_RANGES[TA.iv]||[]).map(function(x){
      return '<button class="rg'+(TA.bars===x[1]?' on':'')+'" data-tabars="'+x[1]+'">'+t(x[0])+'</button>'; }).join('');
    function rows(list){ return list.map(function(x){
      var s=x.signal==='up'?'pos':(x.signal==='down'?'neg':'neu');
      return '<div class="ta-row"><span class="tn">'+esc(x.name)+'</span>'+
        '<span class="tv">'+num(x.value, Math.abs(x.value)>=100?0:2)+'</span>'+
        '<span class="tg '+s+'">'+t('taSig_'+x.signal)+'</span></div>'; }).join(''); }
    var v=D.volume||{}, bb=D.bb||{};
    var interp=taInterpret(D);
    return '<div class="rep-card">'+
      '<div class="ta-head"><span class="rn">'+esc(D.name||TA.name||TA.sym)+'</span>'+
      '<span class="ta-px">'+num(D.price, D.price>=100?1:2)+' '+esc(cur)+'</span></div>'+
      '<div class="ta-rg"><span class="rgl">'+t('taPeriod')+'</span>'+ivs+'</div>'+
      '<div class="ta-rg"><span class="rgl">'+t('taSpan')+'</span>'+ranges+'</div>'+
      taChart(D)+
    '</div>'+

  // grafigi kelimelere cevir
  function taInterpret(D){
    var out=[], p=D.price, S=D.series||{}, v=D.volume||{}, bb=D.bb||{};
    function last(a){ if(!a) return null; for(var i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; }
    var m20=last(S.ma20), m50=last(S.ma50), m200=last(S.ma200);
    if(m200!=null) out.push(t(p>m200?'tiAbove200':'tiBelow200',{v:m200.toFixed(m200>=100?1:2)}));
    if(m50!=null&&m200!=null) out.push(t(m50>m200?'tiGolden':'tiDeath'));
    if(m20!=null&&m50!=null) out.push(t(m20>m50?'tiShortUp':'tiShortDn'));
    if(D.rsi!=null){
      out.push(D.rsi>70?t('tiRsiHot',{v:D.rsi}):(D.rsi<30?t('tiRsiCold',{v:D.rsi}):t('tiRsiMid',{v:D.rsi})));
    }
    if(D.adx!=null) out.push(t(D.adx>=25?'tiAdxTrend':'tiAdxRange',{v:D.adx}));
    if(v.x!=null) out.push(t(v.x>1.5?'tiVolSpike':(v.x<0.7?'tiVolThin':'tiVolNorm'),{v:v.x}));
    if(v.obvTrend) out.push(t(v.obvTrend==='up'?'tiObvUp':(v.obvTrend==='down'?'tiObvDn':'tiObvFlat')));
    if(bb.upper!=null&&bb.lower!=null){
      if(p>=bb.upper) out.push(t('tiBBup'));
      else if(p<=bb.lower) out.push(t('tiBBdn'));
      else if(bb.width!=null&&bb.width<8) out.push(t('tiBBsqueeze',{v:bb.width.toFixed(1)}));
    }
    if(D.hi52) out.push(t('tiFrom52',{v:((p-D.hi52)/D.hi52*100).toFixed(1)}));
    if(D.atrPct!=null) out.push(t('tiAtr',{v:D.atrPct.toFixed(1), a:(D.atr||0).toFixed(2)}));
    return out;
  }
  // ================= GUNLUK ANALIZ (anlatimli rapor + sesli okuma) =================
  var SPK={on:false};
  function briefDate(){
    var loc = lang==='tr'?'tr-TR':(lang==='sv'?'sv-SE':'en-US');
    return new Date().toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long'});
  }
  function bigMovers(){
    var out=[];
    Object.keys(state.companies).forEach(function(k){
      var c=state.companies[k], l=c.live||{};
      if(c.type==='index'||l.status!=='live'||l.pct==null) return;
      out.push({k:k, name:c.name, pct:l.pct, val:liveValSEK(c),
                delta:liveValSEK(c)*(l.pct/100)/(1+l.pct/100), c:c});
    });
    return out;
  }
  // Neden onemli: her pozisyon icin tek cumlelik gerekce uret
  function whyLine(x){
    var c=x.c, tc=c.tech||{}, f=c.fund||{}, bits=[];
    if(tc.rsi!=null){
      if(tc.rsi>70) bits.push(t('bwRsiHot',{v:tc.rsi.toFixed(0)}));
      else if(tc.rsi<30) bits.push(t('bwRsiCold',{v:tc.rsi.toFixed(0)}));
    }
    if(tc.ma200!=null&&tc.price!=null) bits.push(tc.price>tc.ma200?t('bwAbove200'):t('bwBelow200'));
    if(f.profitMargin!=null&&f.profitMargin<0) bits.push(t('bwLoss'));
    else if(f.debtEbitda!=null&&f.debtEbitda>3.5) bits.push(t('bwDebt',{v:f.debtEbitda.toFixed(1)}));
    else if(f.revenueGrowth!=null&&f.revenueGrowth<-0.10) bits.push(t('bwRevDown',{v:(f.revenueGrowth*100).toFixed(0)}));
    return bits.slice(0,2).join(' · ');
  }
  function briefSections(){
    var S=[];
    var mv=bigMovers();
    var tot=0, day=0, up=0, dn=0;
    mv.forEach(function(x){ tot+=x.val; day+=x.delta; if(x.pct>0)up++; else if(x.pct<0)dn++; });
    var dpct=(tot-day)>0?(day/(tot-day)*100):0;

    // 1) ACILIS
    var openTxt = t('bfOpen',{d:briefDate(), tot:fmtMoney(tot),
      dir: day>=0?t('bfUpWord'):t('bfDownWord'), amt:fmtMoney(Math.abs(day)),
      pct:Math.abs(dpct).toFixed(2), up:up, dn:dn});
    S.push({h:t('bfSecOpen'), lines:[openTxt], tone: day>=0?'pos':'neg'});

    // 2) PIYASA ARKA PLANI
    var m=REP.macro;
    if(m){
      function pv(s){ var x=m[s]; return (x&&x.ok&&x.price!=null)?x.price:null; }
      function pc(s){ var x=m[s]; return (x&&x.ok&&x.pct!=null)?x.pct:null; }
      var L=[], vix=pv('^VIX'), spx=pc('^GSPC'), ty=pv('^TNX');
      if(spx!=null) L.push(t(spx>=0?'bfSpxUp':'bfSpxDn',{v:Math.abs(spx).toFixed(2)}));
      if(vix!=null) L.push(t(vix<20?'bfVixCalm':'bfVixTense',{v:vix.toFixed(1)}));
      if(ty!=null) L.push(t(ty>=4.5?'bfRateHigh':'bfRateOk',{v:ty.toFixed(2)}));
      var su=0,sn=0; SECTORS.forEach(function(s){ var cc=pc(s[0]); if(cc!=null){sn++; if(cc>0)su++;} });
      if(sn) L.push(t(su/sn>=0.5?'bfBreadthOk':'bfBreadthWeak',{v:Math.round(su/sn*100)}));
      if(L.length) S.push({h:t('bfSecMarket'), lines:L});
    }

    // 3) GUNUN ONE CIKANLARI
    var byD=mv.slice().sort(function(a,b){return b.delta-a.delta;});
    var W=byD.slice(0,3).filter(function(x){return x.delta>0;});
    var Lz=byD.slice(-3).reverse().filter(function(x){return x.delta<0;});
    if(W.length){
      S.push({h:t('bfSecWin'), tone:'pos', lines:W.map(function(x){
        var w=whyLine(x); return t('bfMover',{n:x.name, p:(x.pct>=0?'+':'')+x.pct.toFixed(2), a:fmtMoney(x.delta)})+(w?' — '+w:''); })});
    }
    if(Lz.length){
      S.push({h:t('bfSecLose'), tone:'neg', lines:Lz.map(function(x){
        var w=whyLine(x); return t('bfMover',{n:x.name, p:x.pct.toFixed(2), a:fmtMoney(x.delta)})+(w?' — '+w:''); })});
    }

    // 4) DIKKAT GEREKTIRENLER
    var warn=[];
    Object.keys(state.companies).forEach(function(k){
      var c=state.companies[k]; if(c.type!=='stock') return;
      var tc=c.tech||{}, f=c.fund||{}, l=c.live||{}, r=[];
      if(tc.rsi!=null&&tc.rsi>72) r.push(t('bwRsiHot',{v:tc.rsi.toFixed(0)}));
      if(tc.rsi!=null&&tc.rsi<28) r.push(t('bwRsiCold',{v:tc.rsi.toFixed(0)}));
      if(f.profitMargin!=null&&f.profitMargin<0) r.push(t('bwLoss'));
      if(f.debtEbitda!=null&&f.debtEbitda>4) r.push(t('bwDebt',{v:f.debtEbitda.toFixed(1)}));
      if(f.revenueGrowth!=null&&f.revenueGrowth<-0.15) r.push(t('bwRevDown',{v:(f.revenueGrowth*100).toFixed(0)}));
      if(l.pct!=null&&Math.abs(l.pct)>=4) r.push(t('bwBigMove',{v:l.pct.toFixed(1)}));
      if(r.length) warn.push({n:c.name, r:r.slice(0,2).join(' · '), w:liveValSEK(c)});
    });
    warn.sort(function(a,b){return b.w-a.w;});
    if(warn.length) S.push({h:t('bfSecWatch'), tone:'neg',
      lines:warn.slice(0,6).map(function(x){ return x.n+' — '+x.r; })});

    // 5) TAKVIM
    var evs=(typeof collectEvents==='function')?collectEvents().slice(0,4):[];
    if(evs.length) S.push({h:t('bfSecCal'),
      lines:evs.map(function(e){ return t('bfCal',{n:e.name, k:evtLabel(e), d:e.days}); })});

    // 6) KAPANIS: yogunlasma
    var ks=Object.keys(state.companies).filter(function(k){return state.companies[k].type!=='index';});
    var tv=0; ks.forEach(function(k){ tv+=liveValSEK(state.companies[k]); });
    var vals=ks.map(function(k){return liveValSEK(state.companies[k]);}).sort(function(a,b){return b-a;});
    var top3=(vals[0]||0)+(vals[1]||0)+(vals[2]||0);
    var cl=[];
    if(tv>0){ var p3=top3/tv*100;
      cl.push(t(p3>40?'bfConcHigh':'bfConcOk',{v:p3.toFixed(0)})); }
    cl.push(t('bfCloseNote'));
    S.push({h:t('bfSecClose'), lines:cl});
    return S;
  }
  function buildBrief(){

    REP.briefText=plain.replace(/[▲▼•·—]/g,' ').replace(/\s+/g,' ');
    var body=S.map(function(s){

        s.lines.map(function(x){ return '<div class="bf-l'+(s.tone?' '+s.tone:'')+'">'+esc(x)+'</div>'; }).join('')+

  function speakBrief(){
    if(!('speechSynthesis' in window)){ alert(t('bfNoVoice')); return; }
    if(SPK.on){ window.speechSynthesis.cancel(); SPK.on=false; repBriefDraw(); return; }
    var u=new SpeechSynthesisUtterance(REP.briefText||'');
    u.lang = lang==='tr'?'tr-TR':(lang==='sv'?'sv-SE':'en-US');
    u.rate=1.0; u.pitch=1.0;
    u.onend=function(){ SPK.on=false; repBriefDraw(); };
    u.onerror=function(){ SPK.on=false; repBriefDraw(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    SPK.on=true; repBriefDraw();
  }

  // --- PIYASA GORUNUMU: kural tabanli, tahmin degil ---
  function buildOutlook(up,dn){
    var m=REP.macro; if(!m) return '';
    function pv(s){ var x=m[s]; return (x&&x.ok&&x.price!=null)?x.price:null; }
    function pc(s){ var x=m[s]; return (x&&x.ok&&x.pct!=null)?x.pct:null; }
    var pts=[], score=0, max=0;
    function add(ok,txtKey,vars){ max++; if(ok===null) return; if(ok) score++;
      pts.push({ok:ok, s:t(txtKey,vars||{})}); }

    var vix=pv('^VIX');
    add(vix==null?null:(vix<20), vix==null?'x':(vix<20?'olVixLow':'olVixHigh'), {v:vix?vix.toFixed(1):''});
    var spx=pc('^GSPC');
    add(spx==null?null:(spx>=0), spx==null?'x':(spx>=0?'olSpxUp':'olSpxDn'), {v:Math.abs(spx||0).toFixed(2)});
    var ty=pv('^TNX');
    add(ty==null?null:(ty<4.5), ty==null?'x':(ty<4.5?'olRateOk':'olRateHigh'), {v:ty?ty.toFixed(2):''});
    var secUp=0, secN=0;
    SECTORS.forEach(function(s){ var c=pc(s[0]); if(c!=null){ secN++; if(c>0) secUp++; } });
    var brd = secN? Math.round(secUp/secN*100) : null;
    add(brd==null?null:(brd>=50), brd==null?'x':(brd>=50?'olBreadthOk':'olBreadthWeak'), {v:brd});
    var mine = (up+dn)? Math.round(up/(up+dn)*100) : null;
    add(mine==null?null:(mine>=50), mine==null?'x':(mine>=50?'olMineOk':'olMineWeak'), {v:mine});

    var tone = score>=4 ? 'pos' : (score<=1 ? 'neg' : 'neu');
    var head = score>=4 ? t('olRisky') : (score<=1 ? t('olDefensive') : t('olMixed'));
    return '<div class="rep-card"><div class="rep-h">'+t('olTitle')+'</div>'+
      '<div class="ol-head '+tone+'">'+head+' <span class="ol-sc">'+score+'/'+max+'</span></div>'+
      '<div class="ol-bar"><span style="width:'+Math.round(score/max*100)+'%"></span></div>'+
      pts.map(function(x){ return '<div class="ol-p '+(x.ok?'pos':'neg')+'">'+(x.ok?'▲':'▼')+' '+esc(x.s)+'</div>'; }).join('')+
      '<div class="fa-note">'+t('olNote')+'</div></div>';
  }

  function loadNews(){

    fetch('/api/newsfeed?s='+encodeURIComponent(syms.join(',')))

        else { x.names=map; REP.news=x; }

      .catch(function(){ REP.nloading=false; REP.news={items:[],pos:0,neg:0,neu:0,topics:[],names:{}};

  // --- TRADE RADARI: kisa vade uygunluk taramasi (teknik + temel) ---
  function tradeScore(c){
    if(c.type!=='stock') return null;
    var tc=c.tech, l=c.live||{};
    if(!tc||tc.rsi==null||tc.price==null) return null;
    var pts=[], score=0, max=0, p=tc.price;
    function add(ok,key,vars){ max++; if(ok){score++;} pts.push({ok:ok,key:key,vars:vars||{}}); }
    add(tc.ma20!=null && p>tc.ma20, 'trTrend');
    add(tc.macd&&tc.macd.hist!=null&&tc.macd.hist>0, 'trMom');
    add(tc.rsi>=35&&tc.rsi<=70, (tc.rsi>70?'trRsiHot':(tc.rsi<35?'trRsiCold':'trRsiOk')), {v:tc.rsi.toFixed(0)});
    var dr=(l.high!=null&&l.low!=null&&l.price)?((l.high-l.low)/l.price*100):null;
    add(dr!=null&&dr>=1.2, 'trVol', {v:dr!=null?dr.toFixed(1):'?'});
    add(l.pct!=null&&Math.abs(l.pct)>=0.8, 'trActive', {v:l.pct!=null?Math.abs(l.pct).toFixed(1):'?'});
    var f=c.fund||{};
    var fBad=((f.profitMargin!=null&&f.profitMargin<0)?1:0)+((f.debtEbitda!=null&&f.debtEbitda>3.5)?1:0)+((f.revenueGrowth!=null&&f.revenueGrowth<-0.10)?1:0);
    var fHas=f.profitMargin!=null||f.revenueGrowth!=null;
    add(fHas&&fBad===0, fBad>0?'trFundBad':'trFundOk');
    return {score:score,max:max,pts:pts};
  }

  // --- KURULUM DEGERLENDIRMESI: risk/odul + net okuma ---
  function setupRead(L, tc){
    if(!L||!L.ok||L.price==null) return '';
    var p=L.price, atr=L.atr||0;
    var res=(L.resistances&&L.resistances.length)?L.resistances[0]:null;
    var sup=(L.supports&&L.supports.length)?L.supports[0]:null;
    function pl(v){ return v==null?'—':v.toFixed(v>100?1:2); }
    var up = res!=null ? (res-p) : null;
    var dn = sup!=null ? (p-sup) : null;
    var rr = (up!=null&&dn!=null&&dn>0) ? (up/dn) : null;
    // yakinlik: fiyat destege mi dirence mi yakin (ATR cinsinden)
    var toRes = (up!=null&&atr)? up/atr : null;
    var toSup = (dn!=null&&atr)? dn/atr : null;
    var stop = (sup!=null)? (sup-0.5*atr) : null;
    var lines=[], verdict, vcls;
    if(rr==null){ verdict=t('suNoLevels'); vcls='neu'; }
    else if(rr>=2 && toSup!=null && toSup<=1.5){ verdict=t('suGood'); vcls='pos'; }
    else if(rr>=1.5){ verdict=t('suOk'); vcls='pos'; }
    else if(rr>=0.8){ verdict=t('suMeh'); vcls='neu'; }
    else { verdict=t('suPoor'); vcls='neg'; }
    if(rr!=null) lines.push(t('suRR',{v:rr.toFixed(1), u:pl(up), d:pl(dn)}));
    if(toRes!=null&&toRes<0.7) lines.push(t('suNearRes',{v:pl(res)}));
    if(toSup!=null&&toSup<0.7) lines.push(t('suNearSup',{v:pl(sup)}));
    if(tc&&tc.rsi!=null&&tc.rsi>70) lines.push(t('suRsiHot'));
    if(tc&&tc.rsi!=null&&tc.rsi<30) lines.push(t('suRsiCold'));
    if(L.volX!=null&&L.volX<0.6) lines.push(t('suThin'));
    if(stop!=null) lines.push(t('suStop',{v:pl(stop), a:pl(atr)}));
    if(res!=null) lines.push(t('suTarget',{v:pl(res)}));
    return '<div class="su-box '+vcls+'">'+
      '<div class="su-v">'+esc(verdict)+'</div>'+
      lines.map(function(x){ return '<div class="su-l">• '+esc(x)+'</div>'; }).join('')+
      '<div class="fa-note">'+t('suNote')+'</div></div>';
  }

  var TX_KEY='portfoyTx_v1';

  function txLoad(){ try{ var r=localStorage.getItem(TX_KEY); TX.list=r?(JSON.parse(r)||[]):[]; }catch(e){ TX.list=[]; } }
  function txSave(){ try{ localStorage.setItem(TX_KEY, JSON.stringify(TX.list)); }catch(e){} }
  function txId(){ return 't'+Date.now()+Math.random().toString(36).slice(2,6); }
  var TX_KINDS=[['buy','txBuy'],['sell','txSell'],['opt','txOpt'],['cash','txCash']];

  /* Hisse pozisyonlarını işlemlerden hesapla: kesin adet + ortalama maliyet */
  function txPositions(){
    var pos={};
    TX.list.slice().sort(function(a,b){ return (a.date||'')<(b.date||'')?-1:1; }).forEach(function(t){
      if(t.kind!=='buy'&&t.kind!=='sell') return;
      var k=(t.ysym||'').toUpperCase(); if(!k) return;
      var p=pos[k]||(pos[k]={qty:0,cost:0,realized:0,ccy:t.ccy||'',name:t.name||k});
      var q=Number(t.qty)||0, pr=Number(t.price)||0, fee=Number(t.fee)||0;
      if(t.kind==='buy'){ p.qty+=q; p.cost+=q*pr+fee; }
      else {
        var avg = p.qty>0 ? p.cost/p.qty : 0;
        var sold=Math.min(q,p.qty);
        p.realized += sold*(pr-avg) - fee;
        p.cost -= sold*avg; p.qty -= sold;
        if(p.qty<1e-9){ p.qty=0; p.cost=0; }
      }
    });
    return pos;
  }
  function txCashBalance(){
    var bal=0;
    TX.list.forEach(function(t){
      var fee=Number(t.fee)||0;
      if(t.kind==='cash') bal += (Number(t.amount)||0);
      else if(t.kind==='buy') bal -= (Number(t.qty)||0)*(Number(t.price)||0)+fee;
      else if(t.kind==='sell') bal += (Number(t.qty)||0)*(Number(t.price)||0)-fee;
      else if(t.kind==='opt'){ var mult=(Number(t.contracts)||0)*100*(Number(t.premium)||0);
        bal += (t.side==='sell'? mult : -mult) - fee; }
    });
    return bal;
  }
  function txOptionPositions(){
    var m={};
    TX.list.filter(function(t){return t.kind==='opt';}).forEach(function(t){
      var key=[(t.ysym||'').toUpperCase(),t.optType,t.strike,t.expiry].join('|');
      var o=m[key]||(m[key]={ysym:t.ysym,name:t.name,optType:t.optType,strike:Number(t.strike),
        expiry:t.expiry,contracts:0,cost:0,ccy:t.ccy||''});
      var c=Number(t.contracts)||0, pr=Number(t.premium)||0;
      if(t.side==='buy'){ o.contracts+=c; o.cost+=c*100*pr; }
      else { o.contracts-=c; o.cost-=c*100*pr; }
    });
    return Object.keys(m).map(function(k){return m[k];}).filter(function(o){ return Math.abs(o.contracts)>0.0001; });
  }

  function syncQtyFromTx(){
    var pos=txPositions(); var changed=false;
    Object.keys(pos).forEach(function(ys){
      var p=pos[ys]; if(!(p.qty>0)) return;
      Object.keys(state.companies).forEach(function(k){

        if((c.ysym||'').toUpperCase()===ys){ c.qty=p.qty; c.antal=p.qty; c.txCost=p.cost; changed=true; }
      });
    });
    if(changed){ persist(); renderPanel(); }
  }

  function bigNum(v,cur){
    if(v==null||isNaN(v)) return '—';
    var neg=v<0; v=Math.abs(v); var s;
    if(v>=1e12) s=(v/1e12).toFixed(2)+'T'; else if(v>=1e9) s=(v/1e9).toFixed(2)+'B';
    else if(v>=1e6) s=(v/1e6).toFixed(1)+'M'; else if(v>=1e3) s=(v/1e3).toFixed(0)+'K';
    else s=v.toFixed(0);
    return (neg?'-':'')+s+(cur?' '+cur:'');
  }

    if(c.code==='L') return pctTxt(v)+(ex.stock!=null? ' ('+pctTxt(ex.stock,0)+' vs '+pctTxt(ex.index,0)+')':'');
    if(c.code==='I') return (v!=null?v.toFixed(1)+'%':'—')+(ex.holders?' · '+ex.holders+' '+t('csHolders'):'');

    var map={
      inc:['income',[['totalRevenue','fiRev','money'],['grossProfit','fiGross','money'],
                     ['operatingIncome','fiOp','money'],['ebitda','fiEbitda','money'],
                     ['netIncome','fiNet','money'],['eps','fiEps','plain']]],
      bal:['balance',[['totalAssets','fiAssets','money'],['totalLiab','fiLiab','money'],
                      ['totalStockholderEquity','fiEquity','money'],['cash','fiCash','money'],
                      ['longTermDebt','fiDebt','money']]],
      cf:['cashflow',[['totalCashFromOperatingActivities','fiOpCf','money'],
                      ['capitalExpenditures','fiCapex','money'],
                      ['freeCashFlow','fiFcf','money'],['netIncome','fiNet','money']]]};
    var cfg=map[AN.tab]; if(!cfg) return '';
    var data=(f[cfg[0]]||{})[AN.period]||[];
    if(!data.length){ data=(f[cfg[0]]||{}).annual||[]; }
    if(!data.length) return '<div class="an-empty">'+t('anNoData')+'</div>';
    // --- Veri tazeliği uyarısı: Yahoo son çeyreği henüz işlemediyse dürüstçe söyle ---
    var fresh='';
    if(AN.tab!=='prof'){
      var newestStmt=(data[0]||{}).date||'';
      var eh=(f.earningsHistory||[]).filter(function(e){return e.actual!=null;});
      var newestEarn=eh.length?eh[0]:null;
      var stale = newestEarn && newestEarn.quarter && newestStmt && newestEarn.quarter > newestStmt;
      if(stale && AN.period==='quarterly'){
        var sp=newestEarn.surprisePct!=null?newestEarn.surprisePct*100:null;
        fresh='<div class="stale"><b>⚠️ '+t('stTitle')+'</b><div class="st-b">'+
          t('stBody',{q:newestEarn.quarter, s:newestStmt})+'</div>'+
          '<div class="st-e">'+t('stEps')+': <b>'+newestEarn.actual.toFixed(2)+'</b>'+
          (newestEarn.estimate!=null?(' · '+t('faEst')+' '+newestEarn.estimate.toFixed(2)):'')+
          (sp!=null?(' · <span class="'+(sp>=0?'pos':'neg')+'">'+pctTxt(sp,1)+'</span>'):'')+'</div></div>';
      } else if(newestStmt){
        fresh='<div class="asof">'+t('stAsOf')+': <b>'+esc(newestStmt)+'</b></div>';
      }
    }
    var per=[['quarterly','faQ'],['annual','faY']].map(function(pp){
      return '<button class="fa-per'+(AN.period===pp[0]?' on':'')+'" data-per="'+pp[0]+'">'+t(pp[1])+'</button>'; }).join('');
    var cards=cfg[1].filter(function(fl){
      return data.some(function(x){ var v=x[fl[0]]; return v!=null && !isNaN(v) && v!==0; });
    }).map(function(fl){
      var key=fl[0], lbl=t(fl[1]), kind=fl[2];
      var vals=data.map(function(x){ return x[key]; });
      var cur=vals[0], prev=vals.length>1?vals[1]:null, yr=vals.length>3?vals[3]:null;
      function pc(a,b){ return (a!=null&&b!=null&&b!==0)?((a-b)/Math.abs(b)*100):null; }
      var gP=pc(cur,prev), gY=(AN.period==='quarterly')?pc(cur,yr):null;
      var fmt=function(v){ return kind==='money'?bigNum(v,''):(v!=null?v.toFixed(2):'—'); };
      var ordered=vals.slice().reverse();
      var fin=ordered.filter(function(v){return v!=null&&!isNaN(v);});
      var mx=Math.max.apply(null,fin.map(Math.abs))||1;
      var bars=ordered.map(function(v,i){
        var h=(v==null)?4:Math.max(5,Math.abs(v)/mx*100);
        var neg=(v!=null&&v<0), lastOne=(i===ordered.length-1);
        var dt=(data[ordered.length-1-i]||{}).date||'';
        return '<div class="mb-col"><span class="'+(neg?'neg':'')+(lastOne?' now':'')+'" style="height:'+h+'%"></span><em>'+dt.slice(2,7)+'</em></div>';
      }).join('');
      function chip(v,lab){ if(v==null) return ''; return '<span class="mc-chip '+(v>=0?'pos':'neg')+'">'+lab+' '+pctTxt(v,1)+'</span>'; }
      return '<div class="mcard"><div class="mc-top"><span class="mc-l">'+lbl+'</span><span class="mc-v'+((cur!=null&&cur<0)?' neg':'')+'">'+fmt(cur)+'</span></div>'+
        '<div class="mc-bars">'+bars+'</div><div class="mc-chips">'+chip(gP,t('faVsPrev'))+chip(gY,t('faVsYear'))+'</div></div>';
    }).join('');
    if(!cards) return '<div class="an-empty">'+t('anNoData')+'</div>';
    var marg='';
    if(AN.tab==='inc' && data[0] && data[0].totalRevenue){
      var r0=data[0], rev=r0.totalRevenue;
      var mm=[['grossProfit','fiGrossM'],['operatingIncome','fiOpM'],['netIncome','fiNetM']]
        .filter(function(x){ return r0[x[0]]!=null && r0[x[0]]!==0; })
        .map(function(x){ var v=r0[x[0]]/rev*100;
          return '<div class="mg"><span>'+t(x[1])+'</span><b class="'+(v>=0?'pos':'neg')+'">%'+v.toFixed(1)+'</b></div>'; }).join('');
      if(mm) marg='<div class="mg-row">'+mm+'</div>';
    }
    var fut='';
    if(AN.tab==='inc'){
      var g=f.growth||{};
      var items=[['0q','esQ0'],['+1q','esQ1'],['0y','esY0'],['+1y','esY1']].filter(function(o){return g[o[0]];});
      if(items.length){
        fut='<div class="fut"><div class="fut-h">🔮 '+t('faOutlook')+'</div><div class="fut-list">'+
          items.map(function(o){ var v=g[o[0]]; var gr=v.growth!=null?v.growth*100:null;
            return '<div class="fut-row"><span class="fr-p">'+t(o[1])+'</span><span class="fr-v">'+bigNum(v.revEstimate,'')+
              '</span><span class="fr-e">EPS '+(v.epsEstimate!=null?v.epsEstimate.toFixed(2):'—')+
              '</span><span class="fr-g '+(gr==null?'':(gr>=0?'pos':'neg'))+'">'+(gr!=null?pctTxt(gr,0):'—')+'</span></div>'; }).join('')+
          '</div><div class="fa-note" style="margin-top:7px">'+t('faEstNote')+'</div></div>';
      }
    }
    return '<div class="fa-per-row">'+per+'</div>'+fresh+cards+marg+fut+'<div class="fa-note">'+t('faUnit',{c:cur})+'</div>';
  }
  document.getElementById('anGo').addEventListener('click',anSearchDo);
  document.getElementById('anQuery').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); anSearchDo(); } });
  document.getElementById('anResults').addEventListener('click',function(e){
    var b=e.target.closest('[data-pick]'); if(b) anPick(b.getAttribute('data-pick'), b.getAttribute('data-nm')); });
  document.getElementById('anQuick').addEventListener('click',function(e){
    var b=e.target.closest('[data-qs]'); if(b) anPick(b.getAttribute('data-qs'), b.getAttribute('data-qn')); });
  document.getElementById('anBody').addEventListener('click',function(e){
    var t1=e.target.closest('[data-fa]'); if(t1){ AN.tab=t1.getAttribute('data-fa'); renderAnalysis(); return; }
    var t2=e.target.closest('[data-per]'); if(t2){ AN.period=t2.getAttribute('data-per'); renderAnalysis(); } });
  function renderAnQuick(){
    var el=document.getElementById('anQuick'); if(!el) return;
    var ks=Object.keys(state.companies).filter(function(k){ var c=state.companies[k]; return c.type==='stock'&&c.ysym; }).slice(0,6);
    el.innerHTML=ks.map(function(k){ var c=state.companies[k];
      return '<button data-qs="'+esc(c.ysym)+'" data-qn="'+esc(c.name)+'">'+esc(c.name)+'</button>'; }).join('');
  }

  // Açılış ekranı: ilk fiyatlar gelince ya da en geç 6 sn sonra kapan
  var splashDone=false;
  function hideSplash(){ if(splashDone) return; splashDone=true;
    var s=document.getElementById('splash'); if(!s) return;
    s.classList.add('hide'); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 400);
  }
  (function watchSplash(){
    var msg=document.getElementById('spMsg');
    var iv=setInterval(function(){
      var live=Object.keys(state.companies).filter(function(k){var l=state.companies[k].live;return l&&l.status==='live';}).length;
      if(msg) msg.textContent = live ? (live+' / '+Object.keys(state.companies).length) : 'Bağlanıyor…';
      if(live>=Math.min(8, Object.keys(state.companies).length)){ clearInterval(iv); hideSplash(); }
    }, 250);
    setTimeout(function(){ clearInterval(iv); hideSplash(); }, 6000);
  })();

  applySkin();
  render(); renderAnalysis(); renderAnQuick(); loadFx(); refreshAll();
  // Bildirim takibi için sembolleri sunucuya bildir
  setTimeout(function(){ try{
    var syms=Object.keys(state.companies).filter(function(k){var c=state.companies[k];return c.ysym&&c.type==='stock';}).map(function(k){return state.companies[k].ysym;});
    if(syms.length) fetch('/api/watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms})}).catch(function(){});
  }catch(e){} }, 12000);
  setTimeout(notifyDue, 9000);                 // açılışta bir kez kontrol
  setInterval(notifyDue, 30*60*1000);          // sonra yarım saatte bir
})();
</script>
</body>
</html>
